<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次方程式（中3）— まちがいLABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#eff6fc;min-height:100vh;padding:1.5rem 1rem}
.container{max-width:640px;margin:0 auto}
:root{
  --blu:#dcebf7;--blu2:#a8cae8;--blu3:#3b7fbf;--blu4:#265d8f;
  --blutext:#0e2e50;--blutext2:#254978;
  --peach:#faeeda;--peachtext:#633806;
  --rose:#fbeaf0;--rosetext:#72243e;
  --sage:#eaf3de;--sagetext:#27500a;
  --r20:20px;--r16:16px;--card-border:#a8cae8;
}
.back-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--card-border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--blutext2);cursor:pointer;margin-bottom:1rem;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;text-decoration:none}
.back-link:hover{background:var(--blu)}
.top-header{background:var(--blu);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;border:1.5px solid var(--blu2)}
.top-icon{width:48px;height:48px;border-radius:50%;background:var(--blu3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.top-title{font-size:18px;font-weight:700;color:var(--blutext)}
.top-sub{font-size:12px;color:var(--blutext2);margin-top:2px}
.top-badge{display:inline-block;background:#fff;border:1px solid var(--blu2);border-radius:999px;font-size:10px;font-weight:700;color:var(--blutext2);padding:2px 10px;margin-top:4px}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.ptab{padding:9px 4px;border-radius:999px;border:none;background:#c5dcf0;font-size:12px;color:#0e2e50;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.18s;font-family:'Zen Maru Gothic',sans-serif;font-weight:400}
.ptab span{display:block;font-size:10px;margin-top:2px;opacity:0.85}
.ptab.active{background:var(--blu3);color:#fff;font-weight:700}
.q-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.25rem;margin-bottom:1rem}
.q-num-badge{display:inline-flex;align-items:center;gap:5px;background:var(--blu);color:var(--blutext);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.q-formula{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#1a1a2e;margin-bottom:4px}
.q-direction{font-size:13px;color:var(--blutext2);margin-bottom:1rem}
.pip-row{display:flex;gap:5px;margin-bottom:1.25rem}
.pip{flex:1;height:8px;border-radius:999px}
.reveal-btn{display:inline-flex;align-items:center;gap:6px;background:var(--blu);color:var(--blutext);border:1.5px solid var(--blu2);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.reveal-btn:hover{background:var(--blu2)}
.dontknow-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;margin-left:8px}
.ans-box{background:var(--blu);border-radius:var(--r16);padding:1rem;margin-top:10px;display:none;border:1px solid var(--blu2)}
.ans-box.show{display:block}
.ans-label{font-size:11px;color:var(--blutext2);margin-bottom:4px;font-weight:700}
.ans-val{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--blutext);margin-bottom:6px}
.ans-hint{font-size:12px;color:var(--blutext2);line-height:1.7}
.eval-wrap{margin-top:1rem;display:none}
.eval-wrap.show{display:block}
.eval-q{font-size:13px;color:var(--blutext2);margin-bottom:8px}
.eval-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e-btn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.e-btn:hover{background:var(--blu)}
.e-ok.sel{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.e-half.sel{background:var(--peach);border-color:#ba7517;color:var(--peachtext)}
.e-ng.sel{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.nav-count{font-size:12px;color:var(--blutext2)}
.next-btn{display:inline-flex;align-items:center;gap:6px;background:var(--blu3);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.next-btn:hover{background:var(--blu4)}
.next-btn:disabled{opacity:0.3;cursor:default}
.step-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:1.25rem}
.snav{padding:8px 2px;border-radius:999px;border:none;background:#c5dcf0;font-size:10px;color:var(--blutext2);cursor:pointer;text-align:center;line-height:1.35;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.snav span{display:block;font-size:9px;margin-top:2px;opacity:0.8}
.snav.active{background:var(--blu3);color:#fff;font-weight:700}
.sub-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem}
.subbtn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--blu2);background:#fff;font-size:12px;font-weight:700;color:var(--blutext);cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.subbtn:hover{background:var(--blu)}
.subbtn.active{background:var(--blu3);color:#fff;border-color:var(--blu3)}
.formula-ref{background:var(--blu);border-radius:var(--r16);padding:1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--blu2)}
.formula-ref-title{font-size:11px;color:var(--blutext2);margin-bottom:8px;font-weight:700}
.frow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--blu2);font-size:12px}
.frow:last-child{border-bottom:none}
.fname{font-weight:700;color:var(--blutext);min-width:110px;flex-shrink:0}
.fexpr{font-family:'JetBrains Mono',monospace;color:var(--blutext2)}
.rule-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem;margin-bottom:0.75rem}
.rule-title{font-size:13px;font-weight:700;color:var(--blutext);margin-bottom:6px}
.rule-ex{font-size:13px;font-family:'JetBrains Mono',monospace;color:#1a1a2e;line-height:1.8}
.rule-note{font-size:11px;color:var(--blutext2);margin-top:4px;line-height:1.6}
.done-wrap{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.5rem}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--blu);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem}
.done-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px;text-align:center}
.done-btns{display:flex;flex-direction:column;gap:8px}
.primary-btn{width:100%;padding:12px;border-radius:999px;border:none;background:var(--blu3);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.primary-btn:hover{background:var(--blu4)}
.secondary-btn{width:100%;padding:11px;border-radius:999px;border:1.5px solid var(--blu2);background:#fff;color:#1a1a2e;font-size:14px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.secondary-btn:hover{background:var(--blu)}
.result-rows{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:0.75rem 1rem;margin-bottom:1rem}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--blu);font-size:13px}
.rrow:last-child{border-bottom:none}
.rformula{font-family:'JetBrains Mono',monospace;flex:1;color:#1a1a2e;font-size:12px}
.rbadge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rb-ok{background:var(--sage);color:var(--sagetext)}
.rb-half{background:var(--peach);color:var(--peachtext)}
.rb-ng{background:var(--rose);color:var(--rosetext)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.stat-c{background:var(--blu);border-radius:var(--r16);padding:0.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-l{font-size:11px;color:var(--blutext2)}
.msg-box{font-size:13px;color:var(--blutext2);line-height:1.7;padding:10px 14px;background:var(--blu);border-radius:var(--r16);margin-bottom:1rem;border:1px solid var(--blu2)}
.sa-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:10px;line-height:1.5;margin-top:1rem}
.sa-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:0.5rem}
.sa-btn{text-align:left;padding:11px 14px;border-radius:var(--r16);border:1.5px solid var(--blu2);background:#fff;font-size:13px;color:#1a1a2e;cursor:pointer;line-height:1.5;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.sa-btn:hover{background:var(--blu)}
.sa-btn.sel{background:var(--blu);border-color:var(--blu3);color:var(--blutext);font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em;line-height:1.3;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px;text-align:center}
.frac>span:last-child{padding:0 3px;text-align:center}
</style>
</head>
<body>
<div class="container">
<a class="back-link" href="index.html">← まちがいLABO トップへ</a>
<div class="top-header">
  <div class="top-icon">x²</div>
  <div>
    <div class="top-title">二次方程式</div>
    <div class="top-sub">力試し → 分析 → 練習 → 再テスト</div>
    <span class="top-badge">中3</span>
  </div>
</div>
<div class="phase-tabs">
  <button class="ptab active" id="tab0" onclick="switchPhase(0)">力試し<span>テスト</span></button>
  <button class="ptab" id="tab1" onclick="switchPhase(1)">自己<span>分析</span></button>
  <button class="ptab" id="tab2" onclick="switchPhase(2)">STEP<span>練習</span></button>
  <button class="ptab" id="tab3" onclick="switchPhase(3)">再<span>テスト</span></button>
</div>
<div id="phase0"></div>
<div id="phase1" style="display:none"></div>
<div id="phase2" style="display:none"></div>
<div id="phase3" style="display:none"></div>
</div>
<script>
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}
function fr(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';}

// ===== 問題プール =====
// レベル1: 移項などをすると x² = 〜 の形になる（平方根で解く）
const POOL_L1=[
  {q:'x² = 9　を解け',                    a:'x = ±3',           hint:'両辺の平方根: x = ±√9 = ±3'},
  {q:'x² = 16　を解け',                   a:'x = ±4',           hint:'両辺の平方根: x = ±√16 = ±4'},
  {q:'x² = 25　を解け',                   a:'x = ±5',           hint:'両辺の平方根: x = ±√25 = ±5'},
  {q:'x² = 7　を解け',                    a:'x = ±√7',          hint:'両辺の平方根: x = ±√7'},
  {q:'x² = 5　を解け',                    a:'x = ±√5',          hint:'両辺の平方根: x = ±√5'},
  {q:'x² = 12　を解け',                   a:'x = ±2√3',         hint:'x = ±√12 = ±2√3'},
  {q:'x² − 9 = 0　を解け',                a:'x = ±3',           hint:'移項: x² = 9 → x = ±3'},
  {q:'x² − 16 = 0　を解け',               a:'x = ±4',           hint:'移項: x² = 16 → x = ±4'},
  {q:'x² − 49 = 0　を解け',               a:'x = ±7',           hint:'移項: x² = 49 → x = ±7'},
  {q:'x² − 5 = 0　を解け',                a:'x = ±√5',          hint:'移項: x² = 5 → x = ±√5'},
  {q:'2x² = 18　を解け',                  a:'x = ±3',           hint:'両辺÷2: x² = 9 → x = ±3'},
  {q:'3x² = 27　を解け',                  a:'x = ±3',           hint:'両辺÷3: x² = 9 → x = ±3'},
  {q:'2x² = 24　を解け',                  a:'x = ±2√3',         hint:'両辺÷2: x² = 12 → x = ±2√3'},
  {q:'4x² − 12 = 0　を解け',              a:'x = ±√3',          hint:'移項: 4x² = 12 → x² = 3 → x = ±√3'},
  {q:'5x² − 20 = 0　を解け',              a:'x = ±2',           hint:'移項: 5x² = 20 → x² = 4 → x = ±2'},
];

// レベル2: (x+p)² = q の形（平方根で解く）
const POOL_L2=[
  {q:'(x + 1)² = 4　を解け',              a:'x = 1, −3',        hint:'x + 1 = ±2 → x = 1, −3'},
  {q:'(x − 3)² = 25　を解け',             a:'x = 8, −2',        hint:'x − 3 = ±5 → x = 8, −2'},
  {q:'(x − 2)² = 9　を解け',              a:'x = 5, −1',        hint:'x − 2 = ±3 → x = 5, −1'},
  {q:'(x + 5)² = 16　を解け',             a:'x = −1, −9',       hint:'x + 5 = ±4 → x = −1, −9'},
  {q:'(x − 4)² = 36　を解け',             a:'x = 10, −2',       hint:'x − 4 = ±6 → x = 10, −2'},
  {q:'(x + 2)² = 49　を解け',             a:'x = 5, −9',        hint:'x + 2 = ±7 → x = 5, −9'},
  {q:'(x + 4)² = 5　を解け',              a:'x = −4 ± √5',      hint:'x + 4 = ±√5 → x = −4 ± √5'},
  {q:'(x − 1)² = 3　を解け',              a:'x = 1 ± √3',       hint:'x − 1 = ±√3 → x = 1 ± √3'},
  {q:'(x − 5)² = 7　を解け',              a:'x = 5 ± √7',       hint:'x − 5 = ±√7 → x = 5 ± √7'},
  {q:'(x + 3)² = 2　を解け',              a:'x = −3 ± √2',      hint:'x + 3 = ±√2 → x = −3 ± √2'},
  {q:'(x + 6)² = 0　を解け',              a:'x = −6（重解）',   hint:'x + 6 = 0 → x = −6'},
  {q:'(x − 2)² = 12　を解け',             a:'x = 2 ± 2√3',      hint:'x − 2 = ±√12 = ±2√3 → x = 2 ± 2√3'},
];

// レベル3-A: 因数分解で解く（ax²+bx+c=0）
const POOL_L3_FAC=[
  {q:'x² + 5x + 6 = 0　を因数分解で解け',
   a:'x = −2, −3',
   hint:'たして 5・かけて 6 → (x+2)(x+3) = 0'},
  {q:'x² − 5x + 6 = 0　を因数分解で解け',
   a:'x = 2, 3',
   hint:'たして −5・かけて 6 → (x−2)(x−3) = 0'},
  {q:'x² + x − 6 = 0　を因数分解で解け',
   a:'x = 2, −3',
   hint:'たして 1・かけて −6 → (x+3)(x−2) = 0'},
  {q:'x² − x − 6 = 0　を因数分解で解け',
   a:'x = 3, −2',
   hint:'たして −1・かけて −6 → (x−3)(x+2) = 0'},
  {q:'x² + 7x + 12 = 0　を因数分解で解け',
   a:'x = −3, −4',
   hint:'たして 7・かけて 12 → (x+3)(x+4) = 0'},
  {q:'x² − 7x + 10 = 0　を因数分解で解け',
   a:'x = 2, 5',
   hint:'たして −7・かけて 10 → (x−2)(x−5) = 0'},
  {q:'x² + 2x − 8 = 0　を因数分解で解け',
   a:'x = 2, −4',
   hint:'たして 2・かけて −8 → (x+4)(x−2) = 0'},
  {q:'x² − 3x − 10 = 0　を因数分解で解け',
   a:'x = 5, −2',
   hint:'たして −3・かけて −10 → (x−5)(x+2) = 0'},
  {q:'x² − 9 = 0　を因数分解で解け',
   a:'x = ±3',
   hint:'和と差: (x+3)(x−3) = 0'},
  {q:'x² + 6x + 9 = 0　を因数分解で解け',
   a:'x = −3（重解）',
   hint:'完全平方: (x+3)² = 0'},
  {q:'x² − 8x + 16 = 0　を因数分解で解け',
   a:'x = 4（重解）',
   hint:'完全平方: (x−4)² = 0'},
  {q:'x² + 4x = 0　を因数分解で解け',
   a:'x = 0, −4',
   hint:'共通因数: x(x+4) = 0'},
  {q:'x² − 3x = 0　を因数分解で解け',
   a:'x = 0, 3',
   hint:'共通因数: x(x−3) = 0'},
];

// レベル3-B: 平方完成で解く
const POOL_L3_COM=[
  {q:'x² + 2x − 3 = 0　を平方完成で解け',
   a:'x = 1, −3',
   hint:'x² + 2x = 3 → (x+1)² − 1 = 3 → (x+1)² = 4 → x+1 = ±2 → x = 1, −3'},
  {q:'x² + 4x − 5 = 0　を平方完成で解け',
   a:'x = 1, −5',
   hint:'x² + 4x = 5 → (x+2)² − 4 = 5 → (x+2)² = 9 → x+2 = ±3 → x = 1, −5'},
  {q:'x² − 6x + 5 = 0　を平方完成で解け',
   a:'x = 1, 5',
   hint:'x² − 6x = −5 → (x−3)² − 9 = −5 → (x−3)² = 4 → x−3 = ±2 → x = 1, 5'},
  {q:'x² + 6x + 4 = 0　を平方完成で解け',
   a:'x = −3 ± √5',
   hint:'(x+3)² − 9 = −4 → (x+3)² = 5 → x = −3 ± √5'},
  {q:'x² − 4x + 1 = 0　を平方完成で解け',
   a:'x = 2 ± √3',
   hint:'(x−2)² − 4 = −1 → (x−2)² = 3 → x = 2 ± √3'},
  {q:'x² + 2x − 4 = 0　を平方完成で解け',
   a:'x = −1 ± √5',
   hint:'(x+1)² − 1 = 4 → (x+1)² = 5 → x = −1 ± √5'},
  {q:'x² − 8x + 12 = 0　を平方完成で解け',
   a:'x = 2, 6',
   hint:'(x−4)² − 16 = −12 → (x−4)² = 4 → x = 2, 6'},
  {q:'x² + 10x + 16 = 0　を平方完成で解け',
   a:'x = −2, −8',
   hint:'(x+5)² − 25 = −16 → (x+5)² = 9 → x = −2, −8'},
  {q:'x² − 2x − 2 = 0　を平方完成で解け',
   a:'x = 1 ± √3',
   hint:'(x−1)² − 1 = 2 → (x−1)² = 3 → x = 1 ± √3'},
  {q:'x² + 4x + 1 = 0　を平方完成で解け',
   a:'x = −2 ± √3',
   hint:'(x+2)² − 4 = −1 → (x+2)² = 3 → x = −2 ± √3'},
  {q:'x² − 6x + 7 = 0　を平方完成で解け',
   a:'x = 3 ± √2',
   hint:'(x−3)² − 9 = −7 → (x−3)² = 2 → x = 3 ± √2'},
  {q:'x² + 8x + 11 = 0　を平方完成で解け',
   a:'x = −4 ± √5',
   hint:'(x+4)² − 16 = −11 → (x+4)² = 5 → x = −4 ± √5'},
];

// レベル3-C: 解の公式で解く
const POOL_L3_FRM=[
  {q:'x² + 3x + 1 = 0　を解の公式で解け',
   a:'x = '+fr('−3 ± √5','2'),
   hint:'a=1, b=3, c=1 → x = '+fr('−3 ± √(9−4)','2')+' = '+fr('−3 ± √5','2')},
  {q:'x² − 5x + 2 = 0　を解の公式で解け',
   a:'x = '+fr('5 ± √17','2'),
   hint:'a=1, b=−5, c=2 → x = '+fr('5 ± √(25−8)','2')+' = '+fr('5 ± √17','2')},
  {q:'x² + 2x − 4 = 0　を解の公式で解け',
   a:'x = −1 ± √5',
   hint:'a=1, b=2, c=−4 → x = '+fr('−2 ± √20','2')+' = '+fr('−2 ± 2√5','2')+' = −1 ± √5'},
  {q:'x² + 5x + 3 = 0　を解の公式で解け',
   a:'x = '+fr('−5 ± √13','2'),
   hint:'a=1, b=5, c=3 → x = '+fr('−5 ± √13','2')},
  {q:'x² − 3x − 1 = 0　を解の公式で解け',
   a:'x = '+fr('3 ± √13','2'),

function ruleRef(keys){
  const all={
    factor:{name:'因数分解', expr:'AB = 0 → A = 0 または B = 0（因数分解の原理）'},
    tada:{name:'たすきがけ', expr:'x² + 5x + 6 = (x+2)(x+3)（たして5、かけて6）'},
    sqrt:{name:'平方根の解き方', expr:'x² = a → x = ±√a（両辺の平方根）'},
    kansei:{name:'平方完成', expr:'x² + 2px = q → (x + p)² = q + p²'},
    formula:{name:'解の公式', expr:'ax² + bx + c = 0 → x = '+fr('−b ± √(b² − 4ac)','2a')},
    kanben:{name:'判別式・和と差', expr:'x² − a² = (x + a)(x − a)、　x² ± 2ax + a² = (x ± a)²'},
    check:{name:'解の確かめ', expr:'求めた値を代入して等式が成り立てば OK'},
  };
  let h='<div class="formula-ref"><div class="formula-ref-title">📖 このSTEPで使うルール</div>';
  keys.forEach(k=>{
    const r=all[k]; if(!r)return;
    h+='<div class="frow"><span class="fname">'+r.name+'</span><span class="fexpr">'+r.expr+'</span></div>';
  });
  h+='</div>';
  return h;
}

    {title:'③ 解き方②：平方完成',ex:'x² + 4x − 5 = 0\n→ x² + 4x = 5\n→ (x + 2)² − 4 = 5\n→ (x + 2)² = 9\n→ x + 2 = ±3\n→ x = 1, −5',note:'x² + 2px の形を (x + p)² − p² に変える。数を移項してから ± の計算に持ち込む。'},
    {title:'④ 解き方③：因数分解',ex:'x² + 5x + 6 = 0\n→ (x + 2)(x + 3) = 0\n→ x = −2 または −3',note:'因数分解できたら AB = 0 → A = 0 または B = 0 の原理で解ける。中3で最初に習う王道！'},
    {title:'⑤ 解き方④：解の公式',ex:'ax² + bx + c = 0\n→ x = '+fr('−b ± √(b² − 4ac)','2a')+'\n\n例: x² + 3x + 1 = 0\n→ x = '+fr('−3 ± √(9 − 4)','2')+' = '+fr('−3 ± √5','2'),note:'どんな二次方程式でも解けるオールマイティ！ 因数分解できないときや平方完成が面倒なときに使う。'},
    {title:'⑥ どの解き方を使う？',ex:'x² = a、(x + p)² = q\n　　→ 平方根\nきれいに因数分解できる\n　　→ 因数分解\n上のどれでもない\n　　→ 解の公式',note:'まずは因数分解を試して、ダメなら解の公式が早い！ 平方完成は「なぜ解の公式が成り立つか」の理解にも大事。'},
    {title:'⑦ AB = 0 の原理',ex:'(x + 2)(x + 3) = 0\n→ x + 2 = 0 または x + 3 = 0\n→ x = −2 または −3',note:'「かけて 0 になる」なら、少なくとも片方は 0 になる。これが因数分解で解ける理由。'},
    {title:'⑧ 解の確かめ',ex:'x = 2 が x² − 5x + 6 = 0 の解？\n2² − 5×2 + 6 = 4 − 10 + 6 = 0 ◯',note:'求めた解を元の式に代入して 0 になれば OK。ミス防止に大事！'},
  ];
  el.innerHTML='<div class="msg-box">📖 二次方程式のルールと 4 つの解き方を確認しよう！</div>'+
    rules.map(r=>'<div class="rule-card"><div class="rule-title">'+r.title+'</div><div class="rule-ex">'+r.ex.replace(/\n/g,'<br>')+'</div><div class="rule-note">💡 '+r.note+'</div></div>').join('')+
    '<button class="primary-btn" onclick="switchStep(1)">STEP 1 へ進む →</button>';
}

function revS(k){
  document.getElementById('ab'+k).className='ans-box show';
  document.getElementById('ew'+k).className='eval-wrap show';
  document.getElementById('rb'+k).style.display='none';
}
function dkS(k){
  const el=document.getElementById('sc');
  const info=getStepInfo(k);
  if(!info)return;
  info.ev[info.cur]='ng';
  revS(k);
  document.getElementById('en'+k).className='e-btn e-ng sel';
  document.getElementById('nb'+k).disabled=false;
}
function evS(k,v){
  const el=document.getElementById('sc');
  const info=getStepInfo(k);
  if(!info)return;
  info.ev[info.cur]=v;
  ['ok','half','ng'].forEach(n=>document.getElementById('e'+n[0]+k).className='e-btn e-'+n+(v===n?' sel':''));
  document.getElementById('nb'+k).disabled=false;
}
function nxS(k){
  const el=document.getElementById('sc');
  const info=getStepInfo(k);
  if(!info)return;
  if(info.cur<info.total-1){info.setCur(info.cur+1);}else{info.setDone();}
  renderP2();
}
function getStepInfo(k){
  if(k==='s1') return {ev:p2.s1ev,cur:p2.s1cur,total:Math.min(p2.s1qs.length,8),setCur:c=>p2.s1cur=c,setDone:()=>p2.s1done=true};
  if(k==='s2') return {ev:p2.s2ev,cur:p2.s2cur,total:Math.min(p2.s2qs.length,8),setCur:c=>p2.s2cur=c,setDone:()=>p2.s2done=true};
  if(k==='s3') return {ev:p2.s3ev,cur:p2.s3cur,total:Math.min(p2.s3qs.length,8),setCur:c=>p2.s3cur=c,setDone:()=>p2.s3done=true};
  if(k==='s4') return {ev:p2.s4ev,cur:p2.s4cur,total:Math.min(p2.s4qs.length,8),setCur:c=>p2.s4cur=c,setDone:()=>p2.s4done=true};
  if(k==='s5') return {ev:p2.s5ev,cur:p2.s5cur,total:10,setCur:c=>p2.s5cur=c,setDone:()=>p2.s5done=true};
  return null;
}

function devCheck(i){if(!window._devChecks)window._devChecks=Array(6).fill(false);window._devChecks[i]=document.getElementById('dev'+i).checked;}
function toggleDev(i){var b=document.getElementById('devans'+i),a=document.getElementById('devarr'+i);if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'\u25B2':'\u25BC';}

var _restTimer=null,_restRemain=0,_restPaused=false;
function c5(){
  var h='';
  h+='<div style="font-size:16px;font-weight:700;color:var(--blutext);margin-bottom:1rem">☕ 休憩する</div>';
  h+='<div style="font-size:14px;font-weight:700;color:#1a1a2e;line-height:1.8;margin-bottom:0.5rem">今日の目標は達成！ゆっくり休もう。<br>頑張った脳には休憩が必要！<br>記憶は休んでいる間に整理されるよ。</div>';
  h+='<div style="font-size:12px;color:#aaa;line-height:1.9;margin-bottom:1.25rem">深呼吸する / 空を見る / 水を飲む / 少し伸びやマッサージをする... などどれも大事な時間✨</div>';
  h+='<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem">';

  h+='</div>';
  h+='<div id="rest-timer" style="display:none;text-align:center">';
  h+='<div id="rest-display" style="font-size:52px;font-weight:700;font-family:JetBrains Mono,monospace;color:var(--blutext);margin-bottom:8px">05:00</div>';

  h+='<button onclick="pauseRest()" id="rest-pause-btn" style="padding:8px 18px;border-radius:999px;border:1.5px solid var(--blu2);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--blutext)">⏸ 一時停止</button>';
  h+='<button onclick="stopRest()" style="padding:8px 18px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#888">✕ やめる</button>';
  h+='</div></div>';
  h+='<div id="rest-done" style="display:none;text-align:center;padding:1rem">';
  h+='<div style="font-size:32px;margin-bottom:8px">🌿</div>';
  h+='<div style="font-size:28px;font-weight:700;color:var(--blutext);margin-bottom:8px">終了！</div>';
  h+='<div style="font-size:14px;color:var(--blutext2);line-height:1.8">気持ちを切り替えて<br>次の課題に挑戦しよう！</div>';
  h+='</div></div>';
  return h;

function startRest(){
  var min=Math.min(15,Math.max(1,parseInt(document.getElementById('rest-min').value)||5));
  _restRemain=min*60; _restPaused=false;
  document.getElementById('rest-start-btn').style.display='none';
  document.getElementById('rest-min').disabled=true;
  document.getElementById('rest-timer').style.display='block';
  updateRestDisplay();
  if(_restTimer)clearInterval(_restTimer);
  _restTimer=setInterval(function(){
    if(_restPaused)return;
    _restRemain--;
    updateRestDisplay();
    if(_restRemain<=0){
      clearInterval(_restTimer);
      document.getElementById('rest-timer').style.display='none';
      document.getElementById('rest-done').style.display='block';
    }
  },1000);
}
function updateRestDisplay(){
  var el=document.getElementById('rest-display');
  if(!el)return;
  var m=Math.floor(_restRemain/60),s=_restRemain%60;
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function pauseRest(){
  _restPaused=!_restPaused;
  var btn=document.getElementById('rest-pause-btn');
  if(btn)btn.textContent=_restPaused?'▶ 再開':'⏸ 一時停止';
}
function stopRest(){
  if(_restTimer)clearInterval(_restTimer);
  document.getElementById('rest-timer').style.display='none';
  document.getElementById('rest-start-btn').style.display='inline-flex';
  document.getElementById('rest-min').disabled=false;
}
