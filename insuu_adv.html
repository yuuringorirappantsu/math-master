<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因数分解（上級）— まちがいLABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#f0f5fd;min-height:100vh;padding:1.5rem 1rem}
.container{max-width:640px;margin:0 auto}
:root{
  --grn:#d6e8fb;--grn2:#93bef0;--grn3:#3a7bd5;--grn4:#2558a8;
  --grntext:#0d2e6b;--grntext2:#1a4a9e;
  --peach:#faeeda;--peachtext:#633806;
  --rose:#fbeaf0;--rosetext:#72243e;
  --sage:#eaf3de;--sagetext:#0d2e6b;
  --r20:20px;--r16:16px;--card-border:#93bef0;
}
.back-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--card-border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--grntext2);cursor:pointer;margin-bottom:1rem;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;text-decoration:none}
.back-link:hover{background:var(--grn)}
.top-header{background:var(--grn);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;border:1.5px solid var(--grn2)}
.top-icon{width:48px;height:48px;border-radius:50%;background:var(--grn3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.top-title{font-size:18px;font-weight:700;color:var(--grntext)}
.top-sub{font-size:12px;color:var(--grntext2);margin-top:2px}
.top-badge{display:inline-block;background:#fff;border:1px solid var(--grn2);border-radius:999px;font-size:10px;font-weight:700;color:var(--grntext2);padding:2px 10px;margin-top:4px}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.ptab{padding:9px 4px;border-radius:999px;border:none;background:#c5d8f7;font-size:12px;color:#1a4a9e;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.18s;font-family:'Zen Maru Gothic',sans-serif;font-weight:400}
.ptab span{display:block;font-size:10px;margin-top:2px;opacity:0.85}
.ptab.active{background:var(--grn3);color:#fff;font-weight:700}
.q-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.25rem;margin-bottom:1rem}
.q-num-badge{display:inline-flex;align-items:center;gap:5px;background:var(--grn);color:var(--grntext);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.q-formula{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#1a1a2e;margin-bottom:4px;line-height:1.5}
.q-direction{font-size:13px;color:#1a4a9e;margin-bottom:1rem}
.pip-row{display:flex;gap:5px;margin-bottom:1.25rem}
.pip{flex:1;height:8px;border-radius:999px}
.reveal-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn);color:var(--grntext);border:1.5px solid var(--grn2);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.reveal-btn:hover{background:var(--grn2)}
.dontknow-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;margin-left:8px}
.dontknow-btn:hover{background:#f5f5f5}
.ans-box{background:#e8f0fd;border-radius:var(--r16);padding:1rem;margin-top:10px;display:none;border:1px solid var(--grn2)}
.ans-box.show{display:block}
.ans-label{font-size:11px;color:var(--grntext2);margin-bottom:4px;font-weight:700}
.ans-val{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--grntext);margin-bottom:6px;line-height:1.6}
.ans-hint{font-size:12px;color:var(--grntext2);line-height:1.7}
.eval-wrap{margin-top:1rem;display:none}
.eval-wrap.show{display:block}
.eval-q{font-size:13px;color:#1a4a9e;margin-bottom:8px}
.eval-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e-btn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.e-btn:hover{background:var(--grn)}
.e-ok.sel{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.e-half.sel{background:var(--peach);border-color:#ba7517;color:var(--peachtext)}
.e-ng.sel{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.nav-count{font-size:12px;color:#1a4a9e}
.next-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn3);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.next-btn:hover{background:var(--grn4)}
.next-btn:disabled{opacity:0.3;cursor:default}
.formula-ref{background:#e8f0fd;border-radius:var(--r16);padding:1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--grn2)}
.formula-ref-title{font-size:11px;color:var(--grntext2);margin-bottom:8px;font-weight:700}
.frow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--grn2);font-size:12px}
.frow:last-child{border-bottom:none}
.fname{font-weight:700;color:var(--grntext);min-width:80px;font-size:11px}
.fexpr{font-family:'JetBrains Mono',monospace;color:var(--grntext2);font-size:11px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.choice-btn{padding:10px 12px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#fff;font-size:12px;color:#1a1a2e;cursor:pointer;text-align:left;line-height:1.5;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.choice-btn:hover{background:var(--grn);border-color:var(--grn3)}
.choice-btn.correct{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.choice-btn.wrong{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.choice-btn.show-ans{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.fb-box{border-radius:var(--r16);padding:12px 14px;font-size:13px;line-height:1.7;display:none;font-family:'Zen Maru Gothic',sans-serif}
.fb-box.show{display:block}
.fb-ok{background:var(--sage);color:var(--sagetext)}
.fb-ng{background:var(--peach);color:var(--peachtext)}
.fb-head{font-weight:700;margin-bottom:4px}
.fb-why{font-size:12px;margin-top:6px;padding-top:6px;border-top:0.5px solid rgba(0,0,0,0.08)}
.xp-pill{display:inline-flex;align-items:center;gap:5px;background:var(--grn);color:var(--grntext);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;opacity:0;transition:opacity 0.4s}
.xp-pill.show{opacity:1}
.step-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:1.25rem}
.snav{padding:8px 3px;border-radius:999px;border:none;background:#c5d8f7;font-size:11px;color:#1a4a9e;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.snav span{display:block;font-size:9px;margin-top:2px;opacity:0.8}
.snav.active{background:var(--grn3);color:#fff;font-weight:700}
.done-wrap{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.5rem}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--grn);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem}
.done-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px;text-align:center}
.done-score{font-size:38px;font-weight:700;color:var(--grntext2);margin:0.75rem 0;text-align:center}
.done-msg{font-size:13px;color:#1a4a9e;margin-bottom:1.25rem;line-height:1.7;text-align:center}
.done-btns{display:flex;flex-direction:column;gap:8px}
.primary-btn{width:100%;padding:12px;border-radius:999px;border:none;background:var(--grn3);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.primary-btn:hover{background:var(--grn4)}
.secondary-btn{width:100%;padding:11px;border-radius:999px;border:1.5px solid var(--grn2);background:#fff;color:#1a1a2e;font-size:14px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.secondary-btn:hover{background:var(--grn)}
.result-rows{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:0.75rem 1rem;margin-bottom:1rem}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--grn);font-size:13px}
.rrow:last-child{border-bottom:none}
.rformula{font-family:'JetBrains Mono',monospace;flex:1;color:#1a1a2e;font-size:11px}
.rbadge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rb-ok{background:var(--sage);color:var(--sagetext)}
.rb-half{background:var(--peach);color:var(--peachtext)}
.rb-ng{background:var(--rose);color:var(--rosetext)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.stat-c{background:#f0f5fd;border-radius:var(--r16);padding:0.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-l{font-size:11px;color:#1a4a9e}
.msg-box{font-size:13px;color:var(--grntext2);line-height:1.7;padding:10px 14px;background:var(--grn);border-radius:var(--r16);margin-bottom:1rem;border:1px solid var(--grn2)}
.sa-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:10px;line-height:1.5;margin-top:1rem}
.sa-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:0.5rem}
.sa-btn{text-align:left;padding:11px 14px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#fff;font-size:13px;color:#1a1a2e;cursor:pointer;line-height:1.5;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.sa-btn:hover{background:var(--grn)}
.sa-btn.sel{background:var(--grn);border-color:var(--grn3);color:var(--grntext);font-weight:700}
.pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.pat-card{background:#fff;border:1.5px solid var(--grn2);border-radius:var(--r16);padding:0.75rem;cursor:pointer;transition:all 0.15s;text-align:left}
.pat-card:hover{background:var(--grn)}
.pat-card.sel{background:var(--grn);border-color:var(--grn3)}
.pat-name{font-size:12px;font-weight:700;color:var(--grntext);margin-bottom:2px}
.pat-ex{font-size:11px;color:var(--grntext2);font-family:'JetBrains Mono',monospace}
/* 縦分数 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:0.8em;line-height:1.1}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 2px;text-align:center}
.frac .den{padding:0 2px;text-align:center}
</style>
</head>
<body>
<div class="container">

<a class="back-link" href="index.html">← まちがいLABO トップへ</a>

<div class="top-header">
  <div class="top-icon">🔍</div>
  <div>
    <div class="top-title">因数分解</div>
    <div class="top-sub">力試し → 分析 → 練習 → 再テスト</div>
    <span class="top-badge">上級編</span>
  </div>
</div>

<div class="phase-tabs">
  <button class="ptab active" id="tab0" onclick="switchPhase(0)">力試し<span>テスト</span></button>
  <button class="ptab" id="tab1" onclick="switchPhase(1)">自己<span>分析</span></button>
  <button class="ptab" id="tab2" onclick="switchPhase(2)">STEP<span>練習</span></button>
  <button class="ptab" id="tab3" onclick="switchPhase(3)">再<span>テスト</span></button>
</div>

<div id="phase0"></div>
<div id="phase1" style="display:none"></div>
<div id="phase2" style="display:none"></div>
<div id="phase3" style="display:none"></div>

</div>
<script>
function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
function fr(n,d){return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';}

// ======= 問題プール =======

// P1: 文字2つ
const POOL_P1=[
  {q:"9x²−4y²",        a:"(3x+2y)(3x−2y)",   hint:"差の公式: (3x)²−(2y)²"},
  {q:"x²−9y²",         a:"(x+3y)(x−3y)",      hint:"差の公式: x²−(3y)²"},
  {q:"x²+4xy+4y²",     a:"(x+2y)²",           hint:"完全平方: x²+2×x×2y+(2y)²"},
  {q:"x²−2xy+y²",      a:"(x−y)²",            hint:"完全平方: x²−2×x×y+y²"},
  {q:"4x²−12xy+9y²",   a:"(2x−3y)²",          hint:"完全平方: (2x)²−2×2x×3y+(3y)²"},
  {q:"x²−y²",          a:"(x+y)(x−y)",         hint:"差の公式: x²−y²"},
  {q:"4x²+4xy+y²",     a:"(2x+y)²",           hint:"完全平方: (2x)²+2×2x×y+y²"},
  {q:"x²+6xy+9y²",     a:"(x+3y)²",           hint:"完全平方: x²+2×x×3y+(3y)²"},
  {q:"16x²−9y²",       a:"(4x+3y)(4x−3y)",    hint:"差の公式: (4x)²−(3y)²"},
  {q:"x²−4y²",         a:"(x+2y)(x−2y)",      hint:"差の公式: x²−(2y)²"},
  {q:"9x²+6xy+y²",     a:"(3x+y)²",           hint:"完全平方: (3x)²+2×3x×y+y²"},
  {q:"x²−10xy+25y²",   a:"(x−5y)²",           hint:"完全平方: x²−2×x×5y+(5y)²"},
  {q:"4x²−y²",         a:"(2x+y)(2x−y)",      hint:"差の公式: (2x)²−y²"},
  {q:"x²+2xy+y²",      a:"(x+y)²",            hint:"完全平方: x²+2×x×y+y²"},
  {q:"25x²−4y²",       a:"(5x+2y)(5x−2y)",    hint:"差の公式: (5x)²−(2y)²"},
];

// P2: 係数あり完全平方・差の公式
const POOL_P2=[
  {q:"4x²−9",          a:"(2x+3)(2x−3)",      hint:"差の公式: (2x)²−3²"},
  {q:"9x²−1",          a:"(3x+1)(3x−1)",      hint:"差の公式: (3x)²−1²"},
  {q:"4x²+12x+9",      a:"(2x+3)²",           hint:"完全平方: (2x)²+2×2x×3+3²"},
  {q:"9x²−6x+1",       a:"(3x−1)²",           hint:"完全平方: (3x)²−2×3x×1+1²"},
  {q:"16x²−25",        a:"(4x+5)(4x−5)",      hint:"差の公式: (4x)²−5²"},
  {q:"4x²−20x+25",     a:"(2x−5)²",           hint:"完全平方: (2x)²−2×2x×5+5²"},
  {q:"9x²+12x+4",      a:"(3x+2)²",           hint:"完全平方: (3x)²+2×3x×2+2²"},
  {q:"25x²−1",         a:"(5x+1)(5x−1)",      hint:"差の公式: (5x)²−1²"},
  {q:"4x²+4x+1",       a:"(2x+1)²",           hint:"完全平方: (2x)²+2×2x×1+1²"},
  {q:"9x²−4",          a:"(3x+2)(3x−2)",      hint:"差の公式: (3x)²−2²"},
  {q:"16x²+8x+1",      a:"(4x+1)²",           hint:"完全平方: (4x)²+2×4x×1+1²"},
  {q:"4x²−8x+4",       a:"(2x−2)²",           hint:"完全平方: (2x)²−2×2x×2+2²"},
  {q:"9x²+6x+1",       a:"(3x+1)²",           hint:"完全平方: (3x)²+2×3x×1+1²"},
  {q:"25x²−16",        a:"(5x+4)(5x−4)",      hint:"差の公式: (5x)²−4²"},
];

// P3: 共通因数＋公式（二段階）
const POOL_P3=[
  {q:"2x²−8",          a:"2(x+2)(x−2)",       hint:"共通因数2を括り出す → 差の公式"},
  {q:"3x²−27",         a:"3(x+3)(x−3)",       hint:"共通因数3を括り出す → 差の公式"},
  {q:"2x²+8x+8",       a:"2(x+2)²",           hint:"共通因数2を括り出す → 完全平方"},
  {q:"3x²−6x+3",       a:"3(x−1)²",           hint:"共通因数3を括り出す → 完全平方"},
  {q:"5x²−20",         a:"5(x+2)(x−2)",       hint:"共通因数5を括り出す → 差の公式"},
  {q:"4x²+16x+16",     a:"4(x+2)²",           hint:"共通因数4を括り出す → 完全平方"},
  {q:"2x²+12x+18",     a:"2(x+3)²",           hint:"共通因数2を括り出す → 完全平方"},
  {q:"4x²−36",         a:"4(x+3)(x−3)",       hint:"共通因数4を括り出す → 差の公式"},
  {q:"2x²−18",         a:"2(x+3)(x−3)",       hint:"共通因数2を括り出す → 差の公式"},
  {q:"3x²+6x+3",       a:"3(x+1)²",           hint:"共通因数3を括り出す → 完全平方"},
  {q:"5x²+10x+5",      a:"5(x+1)²",           hint:"共通因数5を括り出す → 完全平方"},
  {q:"2x²−50",         a:"2(x+5)(x−5)",       hint:"共通因数2を括り出す → 差の公式"},
];

// P4: 文字2つ＋共通因数
const POOL_P4=[
  {q:"2x²−2y²",        a:"2(x+y)(x−y)",       hint:"共通因数2を括り出す → 差の公式"},
  {q:"3x²−3y²",        a:"3(x+y)(x−y)",       hint:"共通因数3を括り出す → 差の公式"},
  {q:"2x²+4xy+2y²",    a:"2(x+y)²",           hint:"共通因数2を括り出す → 完全平方"},
  {q:"3x²−6xy+3y²",    a:"3(x−y)²",           hint:"共通因数3を括り出す → 完全平方"},
  {q:"5x²−5y²",        a:"5(x+y)(x−y)",       hint:"共通因数5を括り出す → 差の公式"},
  {q:"4x²−4y²",        a:"4(x+y)(x−y)",       hint:"共通因数4を括り出す → 差の公式"},
  {q:"2x²+8xy+8y²",    a:"2(x+2y)²",          hint:"共通因数2を括り出す → 完全平方"},
  {q:"6x²−6y²",        a:"6(x+y)(x−y)",       hint:"共通因数6を括り出す → 差の公式"},
];

// P5: 九九の範囲を超えた基本形
const POOL_P5=[
  {q:"x²+23x+132",     a:"(x+11)(x+12)",      hint:"11+12=23, 11×12=132"},
  {q:"x²+23x+130",     a:"(x+10)(x+13)",      hint:"10+13=23, 10×13=130"},
  {q:"x²+27x+180",     a:"(x+12)(x+15)",      hint:"12+15=27, 12×15=180"},
  {q:"x²−24x+143",     a:"(x−11)(x−13)",      hint:"(−11)+(−13)=−24, 11×13=143"},
  {q:"x²−2x−143",      a:"(x+11)(x−13)",      hint:"11+(−13)=−2, 11×(−13)=−143"},
  {q:"x²+29x+210",     a:"(x+14)(x+15)",      hint:"14+15=29, 14×15=210"},
  {q:"x²+25x+156",     a:"(x+12)(x+13)",      hint:"12+13=25, 12×13=156"},
  {q:"x²−22x+120",     a:"(x−10)(x−12)",      hint:"(−10)+(−12)=−22, 10×12=120"},
  {q:"x²+4x−165",      a:"(x+15)(x−11)",      hint:"15+(−11)=4, 15×(−11)=−165"},
  {q:"x²−3x−130",      a:"(x+10)(x−13)",      hint:"10+(−13)=−3, 10×(−13)=−130"},
];

// P6: 分数・小数
const POOL_P6=[

}

function ansS1(idx){
  if(p2.answered)return;p2.answered=true;
  const q=STEP1_QS[p2.cur];
  const btns=document.querySelectorAll('#cg .choice-btn');
  if(idx===q.ans){
    btns[idx].classList.add('correct');
    document.getElementById('fbh1').textContent='正解！';
    document.getElementById('fbw1').textContent=q.why;
    document.getElementById('fb1').className='fb-box fb-ok show';
    p2.score++;
    document.getElementById('xpv').textContent='+20 XP';
    document.getElementById('xpp').className='xp-pill show';
  } else {
    btns[idx].classList.add('wrong');btns[q.ans].classList.add('show-ans');
    document.getElementById('fbh1').textContent='惜しい！正解は「'+q.opts[q.ans]+'」';
    document.getElementById('fbw1').textContent=q.ok+' '+q.why;
    document.getElementById('fb1').className='fb-box fb-ng show';
  }
  document.getElementById('snb').disabled=false;
}

  h+='<div style="font-size:12px;color:#aaa;line-height:1.9;margin-bottom:1.25rem">\u6DF1\u547C\u5438\u3059\u308B / \u7A7A\u3092\u898B\u308B / \u6C34\u3092\u98F2\u3080 / \u5C11\u3057\u4F38\u3073\u3084\u30DE\u30C3\u30B5\u30FC\u30B8 / \u9996\u3092\u56DE\u3059 / \u5C11\u3057\u76EE\u3092\u9596\u3058\u3066\u307F\u308B... \u306A\u3069\u3002\u3069\u308C\u3082\u5927\u4E8B\u306A\u6642\u9593\u2728</div>';
  h+='<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem">';
  h+='<div style="font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:10px">\u4F55\u5206\u4F11\u61A9\u3059\u308B\uFF1F\uFF08\u6700\u592715\u5206\uFF09</div>';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
  h+='<input type="number" id="rest-min" min="1" max="15" value="5" style="width:72px;font-size:24px;font-weight:700;text-align:center;border:1.5px solid var(--grn2);border-radius:var(--r16);padding:8px;font-family:JetBrains Mono,monospace;color:var(--grntext)" oninput="if(this.value>15)this.value=15;if(this.value<1)this.value=1">';
  h+='<span style="font-size:16px;color:#1a1a2e;font-weight:700">\u5206</span>';
  h+='<button onclick="startRest()" id="rest-start-btn" style="padding:10px 20px;border-radius:999px;border:none;background:var(--grn3);color:#fff;font-size:14px;font-weight:700;cursor:pointer">\u30B9\u30BF\u30FC\u30C8 \u25B6</button>';
  h+='</div><div id="rest-timer" style="display:none;text-align:center">';
  h+='<div id="rest-display" style="font-size:52px;font-weight:700;font-family:JetBrains Mono,monospace;color:var(--grntext);margin-bottom:8px">05:00</div>';
  h+='<div style="display:flex;gap:8px;justify-content:center">';
  h+='<button onclick="pauseRest()" id="rest-pause-btn" style="padding:8px 18px;border-radius:999px;border:1.5px solid var(--grn2);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--grntext)">\u23F8 \u4E00\u6642\u505C\u6B62</button>';
  h+='<button onclick="stopRest()" style="padding:8px 18px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#888">\u2715 \u3084\u3081\u308B</button>';
  h+='</div></div>';
  h+='<div id="rest-done" style="display:none;text-align:center;padding:1rem">';
  h+='<div style="font-size:32px;margin-bottom:8px">\uD83C\uDF3F</div>';
  h+='<div style="font-size:28px;font-weight:700;color:var(--grntext);margin-bottom:8px">\u7D42\u4E86\uFF01</div>';
  h+='<div style="font-size:14px;color:var(--grntext2);line-height:1.8">\u6C17\u6301\u3061\u3092\u5207\u308A\u66FF\u3048\u3066<br>\u6B21\u306E\u8AB2\u984C\u306B\u6311\u6226\u3057\u3088\u3046\uFF01</div>';
  h+='</div></div>';
  return h;
}

var _restTimer=null,_restRemain=0,_restPaused=false;

function toggleEffect(){var b=document.getElementById('eff-body'),a=document.getElementById('eff-arrow');if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'\u25B2':'\u25BC';}


function startRest(){
  var min=Math.min(15,Math.max(1,parseInt(document.getElementById('rest-min').value)||5));
  _restRemain=min*60;_restPaused=false;
  document.getElementById('rest-start-btn').style.display='none';
  document.getElementById('rest-min').disabled=true;
  document.getElementById('rest-timer').style.display='block';
  updateRestDisplay();
  if(_restTimer)clearInterval(_restTimer);
  _restTimer=setInterval(function(){
    if(_restPaused)return;_restRemain--;updateRestDisplay();
    if(_restRemain<=0){clearInterval(_restTimer);document.getElementById('rest-timer').style.display='none';document.getElementById('rest-done').style.display='block';}
  },1000);
}

function updateRestDisplay(){var el=document.getElementById('rest-display');if(!el)return;var m=Math.floor(_restRemain/60),s=_restRemain%60;el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

function pauseRest(){_restPaused=!_restPaused;var btn=document.getElementById('rest-pause-btn');if(btn)btn.textContent=_restPaused?'\u25B6 \u518D\u958B':'\u23F8 \u4E00\u6642\u505C\u6B62';}

function stopRest(){if(_restTimer)clearInterval(_restTimer);document.getElementById('rest-timer').style.display='none';document.getElementById('rest-start-btn').style.display='inline-flex';document.getElementById('rest-min').disabled=false;}

const GOAL='因数分解マスターになろう！';
const NEXT_OPTIONS=[
  {icon:'👨‍🏫', label:'説明してみる・教える'},
  {icon:'📚', label:'ほかの問題にも挑戦'},
  {icon:'⏱', label:'タイムアタックに挑戦'},
  {icon:'🚀', label:'もう一歩先の発展問題'},
  {icon:'🔁', label:'基礎に戻って確認'},
  {icon:'☕', label:'休憩する'},
];
function renderGoalAchieved(el){
  var cur=(el&&el.id)?el.id.replace('phase',''):'0';
  [0,1,2,3].forEach(function(i){
    var ph=document.getElementById('phase'+i);
    var tb=document.getElementById('tab'+i);
    if(ph)ph.style.display=String(i)===cur?'block':'none';
    if(tb)tb.className='ptab'+(String(i)===cur?' active':'');
  });
  var btnStyle='padding:14px 8px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:13px;font-weight:700;color:var(--grntext);cursor:pointer;font-family:Zen Maru Gothic,sans-serif;transition:all 0.15s;text-align:center;line-height:1.5;width:100%';
  var optBtns=NEXT_OPTIONS.map(function(opt,i){
    return '<button onclick="showNextOption('+i+')" style="'+btnStyle+'" onmouseover="this.style.background=\'var(--grn)\'" onmouseout="this.style.background=\'#fff\'"><div style="font-size:24px;margin-bottom:4px">'+opt.icon+'</div>'+opt.label+'</button>';
  }).join('');
  el.innerHTML=
    '<div class="done-wrap" style="text-align:center">'+
    '<div style="font-size:48px;margin-bottom:0.5rem">🏆</div>'+
    '<div style="font-size:22px;font-weight:700;color:var(--grntext);margin-bottom:4px">目標達成！</div>'+
    '<div style="font-size:15px;color:var(--grntext2);margin-bottom:1.25rem;font-weight:700">'+GOAL+'</div>'+
    '<div style="background:var(--grn);border-radius:var(--r16);padding:1rem;margin-bottom:1.25rem;border:1px solid var(--grn2);text-align:left">'+
    '<div style="font-size:13px;color:var(--grntext2);line-height:1.8">🌟 全問正解！すばらしい！<br>次は何をする？</div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+optBtns+'</div>'+
    '</div>'+
    '<div id="next-detail"></div>';
}
function showNextOption(i){
  var el=document.getElementById('next-detail');if(!el)return;
  var fns=[c0,c1,c2,c3,c4,c5];
  if(fns[i])el.innerHTML='<div class="q-card" style="margin-top:1rem">'+fns[i]()+'</div>';
}
function c1(){return '<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:1rem">📚 ほかの問題にも挑戦</div><div style="font-size:13px;color:var(--grntext2);line-height:1.8;margin-bottom:1rem">☆ 同じ単元の別の問題で、もう一度力試しをしてみよう！</div><button class="primary-btn" onclick="TEST1.sort(()=>Math.random()-0.5);p0.evals=Array(TEST1.length).fill(null);p0.cur=0;p0.done=false;switchPhase(0);">別の問題でもう一度 →</button>';}
function c2(){var prev=window._taTime||null;var h='<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:1rem">⏱ タイムアタックに挑戦</div><div style="font-size:13px;color:var(--grntext2);line-height:1.8;margin-bottom:1rem">☆ ストップウォッチを用意しよう！</div>';if(prev)h+='<div style="background:#e8f0fd;border:1px solid var(--grn2);border-radius:var(--r16);padding:10px;margin-bottom:1rem;font-size:13px;color:var(--grntext2)">⏱ 前回：<strong style="color:var(--grntext)">'+prev+'</strong></div>';h+='<button class="primary-btn" onclick="TEST1.sort(()=>Math.random()-0.5);p0.evals=Array(TEST1.length).fill(null);p0.cur=0;p0.done=false;switchPhase(0);">⏱ スタート！</button>';return h;}
function c4(){return '<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:1rem">🔁 基礎に戻って確認</div><div style="font-size:13px;color:var(--grntext2);line-height:1.8;margin-bottom:1rem">☆ 満点でも「なんとなく解けた」部分がないか確認しよう！</div><button class="primary-btn" onclick="switchPhase(2)">STEP練習へ戻る →</button>';}
function c3(){
  var qs=[
    {q:'x⁴−1 を因数分解せよ。',
     h:'💡 まず x²−1 と x²+1 に分けられるよ。さらに x²−1 は因数分解できる！',
     a:'x⁴−1=(x²+1)(x²−1)=(x²+1)(x+1)(x−1)',
     level:'★★★'},
    {q:'x²−y²+x+y を因数分解せよ。',
     h:'💡 x²−y²=(x+y)(x−y) と見て、残りの x+y とくくれないか考えよう。',
     a:'x²−y²+x+y=(x+y)(x−y)+(x+y)=(x+y)(x−y+1)',
     level:'★★★'},
    {q:'x²+2xy+y²−9 を因数分解せよ。',
     h:'💡 x²+2xy+y²=(x+y)² と見よう。そうすると (x+y)²−9 の形になるよ。',
     a:'(x+y)²−9=(x+y+3)(x+y−3)',
     level:'★★★'},
    {q:'x⁴+3x²−4 を因数分解せよ。',
     h:'💡 x²=t とおくと t²+3t−4 の形になるよ。まずtで因数分解して、さらに因数分解できるか確認しよう！',
     a:'x²=t とおくと t²+3t−4=(t+4)(t−1)<br>=(x²+4)(x²−1)<br>=(x²+4)(x+1)(x−1)',
     level:'★★★'},
    {q:'a²−b²−a+b を因数分解せよ。',
     h:'💡 a²−b²=(a+b)(a−b) と見て、残りの −a+b=−(a−b) とくくれないか考えよう。',
     a:'a²−b²−a+b=(a+b)(a−b)−(a−b)=(a−b)(a+b−1)',
     level:'★★★'},
  ];
  var checks=window._devChecks||Array(5).fill(false);
  window._devChecks=checks;
  var html='<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:0.75rem">🚀 もう一歩先の発展問題</div>';
  html+='<div style="font-size:13px;color:var(--grntext2);line-height:1.8;margin-bottom:1rem">☆ 少し考えれば解ける！できたらチェックして教えて！</div>';
  qs.forEach(function(q,i){
    html+='<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem;margin-bottom:0.75rem">';
    html+='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">';
    html+='<label style="display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;margin-top:2px">';
    html+='<input type="checkbox" id="dev'+i+'" '+(checks[i]?'checked':'')+' onchange="devCheck('+i+')" style="width:18px;height:18px;accent-color:var(--grn3);cursor:pointer"></label>';
    html+='<div><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--grn);color:var(--grntext);margin-right:6px">'+q.level+'</span>';
    html+='<span style="font-size:13px;font-weight:700;color:#1a1a2e;line-height:1.7">Q'+(i+1)+'. '+q.q+'</span></div></div>';
    html+='<div style="display:flex;gap:8px;margin-bottom:6px">';
    html+='<button onclick="toggleHint('+i+')" style="flex:1;text-align:left;padding:8px 12px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:var(--grn);font-size:12px;font-weight:700;color:var(--grntext);cursor:pointer;display:flex;justify-content:space-between">💡 ヒントを見る <span id="hintarr'+i+'">▼</span></button>';
    html+='<button onclick="toggleDev('+i+')" style="flex:1;text-align:left;padding:8px 12px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#edf9f0;font-size:12px;font-weight:700;color:var(--grntext2);cursor:pointer;display:flex;justify-content:space-between">答えと解説 <span id="devarr'+i+'">▼</span></button>';
    html+='</div>';
    html+='<div id="hintbody'+i+'" style="display:none;background:var(--grn);border:1px solid var(--grn2);border-radius:var(--r16);padding:0.75rem 1rem;margin-bottom:6px;font-size:13px;color:var(--grntext);line-height:1.8">'+q.h+'</div>';
    html+='<div id="devans'+i+'" style="display:none;background:#edf9f0;border:1px solid var(--grn2);border-radius:var(--r16);padding:1rem;font-size:12px;color:var(--grntext2);line-height:1.9">'+q.a+'</div>';
    html+='</div>';
  });
  return html;
}
function devCheck(i){if(!window._devChecks)window._devChecks=Array(5).fill(false);window._devChecks[i]=document.getElementById('dev'+i).checked;}
function toggleDev(i){var b=document.getElementById('devans'+i),a=document.getElementById('devarr'+i);if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'▲':'▼';}
function toggleHint(i){var b=document.getElementById('hintbody'+i),a=document.getElementById('hintarr'+i);if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'▲':'▼';}

</script>
