<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>式の計算（中2・応用編）— まちがいLABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#fdf7ee;min-height:100vh;padding:1.5rem 1rem}
.container{max-width:640px;margin:0 auto}
:root{
  --grn:#fde8d0;--grn2:#f7c994;--grn3:#e69547;--grn4:#c47023;
  --grntext:#5c2e0a;--grntext2:#94501a;
  --peach:#faeeda;--peachtext:#633806;
  --rose:#fbeaf0;--rosetext:#72243e;
  --sage:#eaf3de;--sagetext:#27500a;
  --r20:20px;--r16:16px;--card-border:#f7c994;
}
.back-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--card-border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--grntext2);cursor:pointer;margin-bottom:1rem;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;text-decoration:none}
.back-link:hover{background:var(--grn)}
.top-header{background:var(--grn);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;border:1.5px solid var(--grn2)}
.top-icon{width:48px;height:48px;border-radius:50%;background:var(--grn3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.top-title{font-size:18px;font-weight:700;color:var(--grntext)}
.top-sub{font-size:12px;color:var(--grntext2);margin-top:2px}
.top-badge{display:inline-block;background:#fff;border:1px solid var(--grn2);border-radius:999px;font-size:10px;font-weight:700;color:var(--grntext2);padding:2px 10px;margin-top:4px}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.ptab{padding:9px 4px;border-radius:999px;border:none;background:#fdd9b6;font-size:12px;color:#94501a;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.18s;font-family:'Zen Maru Gothic',sans-serif;font-weight:400}
.ptab span{display:block;font-size:10px;margin-top:2px;opacity:0.85}
.ptab.active{background:var(--grn3);color:#fff;font-weight:700}
.q-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.25rem;margin-bottom:1rem}
.q-num-badge{display:inline-flex;align-items:center;gap:5px;background:var(--grn);color:var(--grntext);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.q-formula{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#1a1a2e;margin-bottom:4px;line-height:1.8}
.q-direction{font-size:13px;color:#94501a;margin-bottom:1rem}
.pip-row{display:flex;gap:5px;margin-bottom:1.25rem}
.pip{flex:1;height:8px;border-radius:999px}
.reveal-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn);color:var(--grntext);border:1.5px solid var(--grn2);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.reveal-btn:hover{background:var(--grn2)}
.dontknow-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;margin-left:8px}
.dontknow-btn:hover{background:#f5f5f5}
.ans-box{background:#fdebd8;border-radius:var(--r16);padding:1rem;margin-top:10px;display:none;border:1px solid var(--grn2)}
.ans-box.show{display:block}
.ans-label{font-size:11px;color:var(--grntext2);margin-bottom:4px;font-weight:700}
.ans-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--grntext);margin-bottom:6px;line-height:1.8}
.ans-hint{font-size:12px;color:var(--grntext2);line-height:1.7}
.eval-wrap{margin-top:1rem;display:none}
.eval-wrap.show{display:block}
.eval-q{font-size:13px;color:#94501a;margin-bottom:8px}
.eval-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e-btn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.e-btn:hover{background:var(--grn)}
.e-ok.sel{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.e-half.sel{background:var(--peach);border-color:#ba7517;color:var(--peachtext)}
.e-ng.sel{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.nav-count{font-size:12px;color:#94501a}
.next-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn3);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.next-btn:hover{background:var(--grn4)}
.next-btn:disabled{opacity:0.3;cursor:default}
.formula-ref{background:#fdebd8;border-radius:var(--r16);padding:1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--grn2)}
.formula-ref-title{font-size:11px;color:var(--grntext2);margin-bottom:8px;font-weight:700}
.frow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--grn2);font-size:12px}
.frow:last-child{border-bottom:none}
.fname{font-weight:700;color:var(--grntext);min-width:110px;font-size:11px}
.fexpr{font-family:'JetBrains Mono',monospace;color:var(--grntext2);font-size:11px;line-height:1.6}
.step-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:1.25rem}
.snav{padding:8px 3px;border-radius:999px;border:none;background:#fdd9b6;font-size:11px;color:#94501a;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.snav span{display:block;font-size:9px;margin-top:2px;opacity:0.8}
.snav.active{background:var(--grn3);color:#fff;font-weight:700}
.done-wrap{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.5rem}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--grn);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem}
.done-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px;text-align:center}
.done-score{font-size:38px;font-weight:700;color:var(--grntext2);margin:0.75rem 0;text-align:center}
.done-btns{display:flex;flex-direction:column;gap:8px}
.primary-btn{width:100%;padding:12px;border-radius:999px;border:none;background:var(--grn3);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.primary-btn:hover{background:var(--grn4)}
.secondary-btn{width:100%;padding:11px;border-radius:999px;border:1.5px solid var(--grn2);background:#fff;color:#1a1a2e;font-size:14px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.secondary-btn:hover{background:var(--grn)}
.result-rows{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:0.75rem 1rem;margin-bottom:1rem}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--grn);font-size:13px}
.rrow:last-child{border-bottom:none}
.rformula{font-family:'JetBrains Mono',monospace;flex:1;color:#1a1a2e;font-size:11px}
.rbadge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rb-ok{background:var(--sage);color:var(--sagetext)}
.rb-half{background:var(--peach);color:var(--peachtext)}
.rb-ng{background:var(--rose);color:var(--rosetext)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.stat-c{background:#fcf2e6;border-radius:var(--r16);padding:0.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-l{font-size:11px;color:#94501a}
.msg-box{font-size:13px;color:var(--grntext2);line-height:1.7;padding:10px 14px;background:var(--grn);border-radius:var(--r16);margin-bottom:1rem;border:1px solid var(--grn2)}
.sa-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:10px;line-height:1.5;margin-top:1rem}
.sa-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:0.5rem}
.sa-btn{text-align:left;padding:11px 14px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#fff;font-size:13px;color:#1a1a2e;cursor:pointer;line-height:1.5;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.sa-btn:hover{background:var(--grn)}
.sa-btn.sel{background:var(--grn);border-color:var(--grn3);color:var(--grntext);font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:0.85em;line-height:1.1}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 3px;text-align:center}
.frac .den{padding:0 3px;text-align:center}
</style>
</head>
<body>
<div class="container">

<a class="back-link" href="index.html">← まちがいLABO トップへ</a>

<div class="top-header">
  <div class="top-icon">式</div>
  <div>
    <div class="top-title">式の計算</div>
    <div class="top-sub">力試し → 分析 → 練習 → 再テスト</div>
    <span class="top-badge">中2・応用編（分数・小数）</span>
  </div>
</div>

<div class="phase-tabs">
  <button class="ptab active" id="tab0" onclick="switchPhase(0)">力試し<span>テスト</span></button>
  <button class="ptab" id="tab1" onclick="switchPhase(1)">自己<span>分析</span></button>
  <button class="ptab" id="tab2" onclick="switchPhase(2)">STEP<span>練習</span></button>
  <button class="ptab" id="tab3" onclick="switchPhase(3)">再<span>テスト</span></button>
</div>

<div id="phase0"></div>
<div id="phase1" style="display:none"></div>
<div id="phase2" style="display:none"></div>
<div id="phase3" style="display:none"></div>

</div>
<script>
function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
function fr(n,d){return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';}

// ======= 問題プール =======

// P1: 単項式の加減（分数・小数係数）— 二元の同類項
const POOL_P1=[
  {q:fr(1,2)+"x + "+fr(1,3)+"y + "+fr(1,2)+"x",   a:"x+"+fr(1,3)+"y",            hint:"xどうし: 1/2x+1/2x=x<br>yはそのまま: 1/3y"},
  {q:fr(2,3)+"a − "+fr(1,4)+"b − "+fr(1,3)+"a",   a:fr(1,3)+"a−"+fr(1,4)+"b",    hint:"aどうし: 2/3a−1/3a=1/3a<br>bはそのまま: −1/4b"},
  {q:"0.5x + 0.3y + 0.5x",                        a:"x+0.3y",                    hint:"xどうし: 0.5x+0.5x=x<br>yはそのまま: 0.3y"},
  {q:fr(3,4)+"x + "+fr(1,4)+"y + "+fr(1,4)+"x",   a:"x+"+fr(1,4)+"y",            hint:"xどうし: 3/4x+1/4x=x<br>yはそのまま: 1/4y"},
  {q:"0.6a + 0.4b − 0.2a",                        a:"0.4a+0.4b",                 hint:"aどうし: 0.6a−0.2a=0.4a<br>bはそのまま: 0.4b"},
  {q:fr(5,6)+"x − "+fr(1,3)+"x + "+fr(1,2)+"y",   a:fr(1,2)+"x+"+fr(1,2)+"y",    hint:"xどうし通分(6): 5/6x−2/6x=3/6x=1/2x<br>y: 1/2y"},
  {q:fr(1,3)+"a + "+fr(2,3)+"b − "+fr(1,3)+"a",   a:fr(2,3)+"b",                 hint:"aどうし: 1/3a−1/3a=0<br>bはそのまま: 2/3b"},
  {q:"0.7x + 0.3y − 0.7x",                        a:"0.3y",                      hint:"xどうし: 0.7x−0.7x=0<br>yはそのまま: 0.3y"},
  {q:"1.2x + 0.5y − 0.2x",                        a:"x+0.5y",                    hint:"xどうし: 1.2x−0.2x=x<br>yはそのまま: 0.5y"},
  {q:fr(1,2)+"x² + "+fr(1,4)+"y − "+fr(1,2)+"x²", a:fr(1,4)+"y",                 hint:"x²どうし: 1/2x²−1/2x²=0<br>yはそのまま: 1/4y"},
  {q:fr(3,4)+"a + "+fr(1,2)+"b − "+fr(1,4)+"a + "+fr(1,2)+"b", a:fr(1,2)+"a+b",  hint:"aどうし: 3/4a−1/4a=1/2a<br>bどうし: 1/2b+1/2b=b"},
  {q:"0.4x + 0.6y + 0.6x − 0.6y",                 a:"x",                          hint:"xどうし: 0.4x+0.6x=x<br>yどうし: 0.6y−0.6y=0"},
  {q:fr(2,3)+"xy + "+fr(1,4)+"y − "+fr(1,3)+"xy", a:fr(1,3)+"xy+"+fr(1,4)+"y",   hint:"xyどうし: 2/3xy−1/3xy=1/3xy<br>yはそのまま: 1/4y"},
  {q:"0.5a²b + 0.3ab − 0.5a²b",                    a:"0.3ab",                     hint:"a²bどうし: 0.5a²b−0.5a²b=0<br>abはそのまま: 0.3ab"},
  {q:fr(1,2)+"x + "+fr(1,3)+"y − "+fr(1,4)+"x + "+fr(1,3)+"y", a:fr(1,4)+"x+"+fr(2,3)+"y", hint:"xどうし通分(4): 2/4x−1/4x=1/4x<br>yどうし: 1/3y+1/3y=2/3y"},
];

// P2: 単項式の乗除（分数・小数）— 二元
const POOL_P2=[
  {q:fr(1,2)+"x × 4y",                      a:"2xy",         hint:"係数: 1/2×4=2<br>文字: x×y=xy"},
  {q:fr(1,3)+"a × 6b",                      a:"2ab",         hint:"係数: 1/3×6=2<br>文字: a×b=ab"},
  {q:"0.5x × 4y",                            a:"2xy",         hint:"係数: 0.5×4=2<br>文字: x×y=xy"},
  {q:fr(2,3)+"x × 3y",                      a:"2xy",         hint:"係数: 2/3×3=2<br>文字: x×y=xy"},
  {q:"0.2a × 5b",                            a:"ab",          hint:"係数: 0.2×5=1<br>文字: a×b=ab"},
  {q:"6xy ÷ 2x",                             a:"3y",          hint:"6xy ÷ 2x = "+fr("6xy","2x")+" = 3y"},
  {q:"8ab ÷ 4b",                             a:"2a",          hint:"8ab ÷ 4b = "+fr("8ab","4b")+" = 2a"},
  {q:fr(1,4)+"x × 8y",                      a:"2xy",         hint:"係数: 1/4×8=2<br>文字: x×y=xy"},
  {q:"0.4x × 5y",                            a:"2xy",         hint:"係数: 0.4×5=2<br>文字: x×y=xy"},
  {q:"12xy ÷ 2x",                            a:"6y",          hint:"12xy ÷ 2x = "+fr("12xy","2x")+" = 6y"},
  {q:fr(3,4)+"x × "+fr(1,3)+"y",           a:fr(1,4)+"xy",  hint:"係数: 3/4×1/3=3/12=1/4<br>文字: x×y=xy"},
  {q:"1.5x × 2y",                            a:"3xy",         hint:"係数: 1.5×2=3<br>文字: x×y=xy"},
  {q:fr(3,2)+"ab ÷ 3",                      a:fr(1,2)+"ab",  hint:"3/2ab ÷ 3 = 3/2×1/3×ab = 1/2ab"},
  {q:"0.6xy ÷ "+fr(3,5),                    a:"xy",          hint:"0.6=3/5 なので 3/5÷3/5=1<br>= 1×xy = xy"},
  {q:fr(4,3)+"x × "+fr(3,8)+"y",           a:fr(1,2)+"xy",  hint:"係数: 4/3×3/8=12/24=1/2<br>文字: x×y=xy"},
];

// P3: 多項式のたし引き（分数・小数係数）— 二元
const POOL_P3=[
  {q:"("+fr(1,2)+"x+y) + ("+fr(1,2)+"x+2y)",       a:"x+3y",         hint:"x: 1/2x+1/2x=x<br>y: y+2y=3y"},
  {q:"("+fr(1,3)+"a+2b) − ("+fr(1,3)+"a−b)",        a:"3b",           hint:"a: 1/3a−1/3a=0<br>b: 2b−(−b)=3b"},
  {q:"(0.5x+3y) + (0.5x−y)",                          a:"x+2y",         hint:"x: 0.5x+0.5x=x<br>y: 3y−y=2y"},
  {q:"("+fr(2,3)+"x+y) + ("+fr(1,3)+"x+2y)",        a:"x+3y",         hint:"x: 2/3x+1/3x=x<br>y: y+2y=3y"},
  {q:"(0.3a+5b) − (0.3a+2b)",                         a:"3b",           hint:"a: 0.3a−0.3a=0<br>b: 5b−2b=3b"},
  {q:"("+fr(3,4)+"x−2y) + ("+fr(1,4)+"x+5y)",       a:"x+3y",         hint:"x: 3/4x+1/4x=x<br>y: −2y+5y=3y"},
  {q:"(1.5x+2y) − (0.5x−y)",                          a:"x+3y",         hint:"x: 1.5x−0.5x=x<br>y: 2y−(−y)=3y"},
  {q:"("+fr(1,2)+"x+"+fr(1,3)+"y) + ("+fr(1,2)+"x+"+fr(2,3)+"y)", a:"x+y", hint:"x: 1/2x+1/2x=x<br>y: 1/3y+2/3y=y"},
  {q:"(0.4x+3y) + (0.6x−y)",                          a:"x+2y",         hint:"x: 0.4x+0.6x=x<br>y: 3y−y=2y"},
  {q:"("+fr(2,5)+"a+4b) − ("+fr(2,5)+"a−2b)",       a:"6b",           hint:"a: 2/5a−2/5a=0<br>b: 4b−(−2b)=6b"},
  {q:"(0.7x²+y) + (0.3x²+4y)",                        a:"x²+5y",        hint:"x²: 0.7x²+0.3x²=x²<br>y: y+4y=5y"},
  {q:"("+fr(5,6)+"x−3y) − ("+fr(1,6)+"x+y)",        a:fr(2,3)+"x−4y", hint:"x: 5/6x−1/6x=4/6x=2/3x<br>y: −3y−y=−4y"},
  {q:"(1.2a−5b) − (0.2a+b)",                          a:"a−6b",         hint:"a: 1.2a−0.2a=a<br>b: −5b−b=−6b"},
  {q:"("+fr(3,4)+"x²+2y) − ("+fr(1,4)+"x²−3y)",     a:fr(1,2)+"x²+5y",hint:"x²: 3/4x²−1/4x²=1/2x²<br>y: 2y−(−3y)=5y"},
  {q:"(0.9x+2y) − (0.4x−3y)",                         a:"0.5x+5y",      hint:"x: 0.9x−0.4x=0.5x<br>y: 2y−(−3y)=5y"},
];

// P4: 多項式×分数・小数（分配法則）— 二元
const POOL_P4=[
  {q:fr(1,2)+"(2x+4y)",                     a:"x+2y",          hint:"1/2×2x=x<br>1/2×4y=2y"},
  {q:fr(1,3)+"(3a−6b)",                     a:"a−2b",          hint:"1/3×3a=a<br>1/3×(−6b)=−2b"},
  {q:"0.5(4x+2y)",                            a:"2x+y",          hint:"0.5×4x=2x<br>0.5×2y=y"},
  {q:fr(2,3)+"(6x−3y)",                     a:"4x−2y",         hint:"2/3×6x=4x<br>2/3×(−3y)=−2y"},
  {q:"0.4(5a+10b)",                           a:"2a+4b",         hint:"0.4×5a=2a<br>0.4×10b=4b"},
  {q:fr(3,4)+"(8x−4y)",                     a:"6x−3y",         hint:"3/4×8x=6x<br>3/4×(−4y)=−3y"},
  {q:"0.2(10x+5y)",                           a:"2x+y",          hint:"0.2×10x=2x<br>0.2×5y=y"},
  {q:fr(1,4)+"(4x+8y)",                     a:"x+2y",           hint:"1/4×4x=x<br>1/4×8y=2y"},
  {q:"(6x+4y) × "+fr(1,2),                  a:"3x+2y",          hint:"6x×1/2=3x<br>4y×1/2=2y"},
  {q:"(9a−3b) × "+fr(1,3),                  a:"3a−b",           hint:"9a×1/3=3a<br>(−3b)×1/3=−b"},
  {q:"0.5(3x−y)",                             a:"1.5x−0.5y",     hint:"0.5×3x=1.5x<br>0.5×(−y)=−0.5y"},

      '<button class="dontknow-btn" id="dk0" onclick="dkP0()">🤔 分からない</button>'+
      '<div class="ans-box" id="ab0"><div class="ans-label">答え</div><div class="ans-val">'+q.a+'</div><div class="ans-hint">💡 <span style="font-family:JetBrains Mono,monospace;line-height:2">'+q.hint+'</span></div></div>'+
      '<div class="eval-wrap" id="ew0"><div class="eval-q">自分の答えはどうだった？</div><div class="eval-row">'+
        '<button class="e-btn e-ok" id="eok0" onclick="setE0(\'ok\')">◯ できた</button>'+
        '<button class="e-btn e-half" id="ehalf0" onclick="setE0(\'half\')">△ 一部</button>'+
        '<button class="e-btn e-ng" id="eng0" onclick="setE0(\'ng\')">✕ 間違い</button>'+
      '</div></div>'+
    '</div>'+
    '<div class="nav-row"><span class="nav-count">'+(p0.cur+1)+' / '+TEST1.length+' 問目</span>'+
      '<button class="next-btn" id="nb0" onclick="nextP0()" disabled>'+(p0.cur===TEST1.length-1?'結果を見る →':'次の問題 →')+'</button></div>';
}
function revealP0(){revealTest('0');}
function dkP0(){dkTest('0',p0.evals,p0.cur);}
function setE0(v){setEvalTest(p0.evals,p0.cur,v,'0');}
function nextP0(){if(p0.cur<TEST1.length-1){p0.cur++;renderP0();}else{p0.done=true;renderP0();}}

/* ======= PHASE 1 自己分析 ======= */
function renderP1(){
  const el=document.getElementById('phase1');
  const labels={ok:'◯',half:'△',ng:'✕'},bc={ok:'rb-ok',half:'rb-half',ng:'rb-ng'};
  let rows=TEST1.map((q,i)=>'<div class="rrow"><span class="rformula">'+q.q+'</span><span class="rbadge '+bc[p0.evals[i]||'ng']+'">'+labels[p0.evals[i]||'ng']+'</span></div>').join('');
  el.innerHTML=
    '<div class="msg-box">💎 間違いは宝物。どこでつまずいたかを知ることが成長の第一歩！</div>'+
    '<div class="result-rows">'+rows+'</div>'+
    '<div class="sa-q">Q1. △や✕の原因であてはまるものをすべて選んでください</div>'+
    '<div class="sa-opts">'+
      ['分数・小数係数の加減が苦手','分数・小数係数の乗除が苦手','分配法則からの加減で間違える（符号など）','頭でっかちの分数のやり方が分からない','通分のやり方が分からない','やり方は分かるけどミスが多い'].map((t,i)=>
        '<button class="sa-btn'+(p1.q1.has(i)?' sel':'')+'" onclick="p1q1('+i+')">'+t+'</button>'
      ).join('')+
    '</div>'+
    '<div class="sa-q">Q2. とくに困った問題は？（複数OK）</div>'+
    '<div class="sa-opts">'+
      ['単項式の加減（分数・小数係数）','単項式の乗除（分数・小数）','多項式のたし引き','多項式×分数・小数（分配法則）','分配法則してから加減する計算','頭でっかちの分数計算（通分）'].map((t,i)=>
        '<button class="sa-btn'+(p1.q2.has(i)?' sel':'')+'" onclick="p1q2('+i+')">'+t+'</button>'
      ).join('')+
    '</div>'+
    '<div class="sa-q">Q3. 次に自分がやるべきだと思うのは？</div>'+
    '<div class="sa-opts">'+
      ['STEP 1 — 単項式の加減・乗除（パターン選択）','STEP 2 — 多項式のたし引き・分配法則からの加減','STEP 3 — 頭でっかちの分数計算','STEP 4 — 全パターンごちゃまぜ'].map((t,i)=>
        '<button class="sa-btn'+(p1.q3===i?' sel':'')+'" onclick="p1q3('+i+')">'+t+'</button>'
      ).join('')+
    '</div>'+
    '<button class="primary-btn" onclick="saGo()" '+(saReady()?'':'disabled style="opacity:0.35;cursor:default"')+'>このSTEPの練習を始める →</button>';
}
function p1q1(i){if(p1.q1.has(i))p1.q1.delete(i);else p1.q1.add(i);renderP1();}
function p1q2(i){if(p1.q2.has(i))p1.q2.delete(i);else p1.q2.add(i);renderP1();}
function p1q3(i){p1.q3=i;renderP1();}
function saReady(){return p1.q1.size>0&&p1.q2.size>0&&p1.q3!==null;}
function saGo(){if(!saReady())return;p2.step=p1.q3;switchPhase(2);}

/* ======= PHASE 2 STEP練習 ======= */
function renderP2(){
  const el=document.getElementById('phase2');
  el.innerHTML=
    '<div class="msg-box">⬆️ レベルアップの時間！自分のペースでじっくり進もう。</div>'+
    '<div class="step-nav">'+
      [['STEP 1','単項式'],['STEP 2','多項式'],['STEP 3','頭でっかち'],['STEP 4','ごちゃまぜ']].map((s,i)=>
        '<button class="snav'+(p2.step===i?' active':'')+'" onclick="switchStep('+i+')">'+s[0]+'<span>'+s[1]+'</span></button>'
      ).join('')+
    '</div>'+
    '<div id="step-content"></div>';
  renderStepContent();
}
function switchStep(i){p2.step=i;renderP2();}
function renderStepContent(){
  const el=document.getElementById('step-content');
  if(p2.step===0)renderS1(el);
  else if(p2.step===1)renderS2(el);
  else if(p2.step===2)renderS3(el);
  else if(p2.step===3)renderS4(el);
}

const RULE_REF=
  '<div class="formula-ref">'+
    '<div class="formula-ref-title">📖 計算ルール早見表</div>'+
    '<div class="frow"><span class="fname">同類項の加減</span><span class="fexpr">同じ文字どうしだけまとめる → <span class="frac"><span>1</span><span>2</span></span>x+<span class="frac"><span>1</span><span>3</span></span>y+<span class="frac"><span>1</span><span>2</span></span>x = x+<span class="frac"><span>1</span><span>3</span></span>y</span></div>'+
    '<div class="frow"><span class="fname">÷は逆数に</span><span class="fexpr">6xy÷2x = <span class="frac"><span>6xy</span><span>2x</span></span> = 3y</span></div>'+
    '<div class="frow"><span class="fname">分配法則</span><span class="fexpr"><span class="frac"><span>1</span><span>2</span></span>(4x+6y)=2x+3y</span></div>'+
    '<div class="frow"><span class="fname">通分</span><span class="fexpr">分母をそろえてから計算 → <span class="frac"><span>x</span><span>2</span></span>+<span class="frac"><span>y</span><span>3</span></span>=<span class="frac"><span>3x</span><span>6</span></span>+<span class="frac"><span>2y</span><span>6</span></span>=<span class="frac"><span>3x+2y</span><span>6</span></span></span></div>'+
  '</div>';

/* STEP1 単項式（加減 or 乗除 選択） */
const STEP1_PATTERNS=[
  {label:"加法・減法（分数・小数係数）", pool:POOL_P1},
  {label:"乗法・除法（分数・小数）",     pool:POOL_P2},
];
function renderS1(el){
  if(p2.s1pat===null){
    el.innerHTML=
      '<div class="q-card">'+
        '<div class="q-num-badge">✏️ STEP 1 — 練習したい方を選ぼう</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">'+
          STEP1_PATTERNS.map((pt,i)=>
            '<div onclick="selectPat1('+i+')" style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:0.75rem;cursor:pointer;transition:all 0.15s" onmouseover="this.style.background=\'var(--grn)\'" onmouseout="this.style.background=\'#fff\'">'+
              '<div style="font-size:12px;font-weight:700;color:var(--grntext);margin-bottom:4px">'+pt.label+'</div>'+
              '<div style="font-size:10px;color:var(--grntext2);font-family:JetBrains Mono,monospace">'+pt.pool[0].q+'</div>'+
            '</div>'
          ).join('')+
        '</div>'+
      '</div>';
    return;
  }
  if(p2.s1done){
    const _qs=p2.s1qs.length?p2.s1qs:STEP1_PATTERNS[p2.s1pat].pool.slice(0,6);
    el.innerHTML=stepDoneHtml('✏️',STEP1_PATTERNS[p2.s1pat].label+' 完了！',_qs,p2.s1evals,
      '<button class="primary-btn" onclick="p2.s1pat=null;p2.s1done=false;p2.s1qs=[];renderP2()">もう一方も練習する</button>'+
      '<button class="primary-btn" style="margin-top:0" onclick="switchStep(1)">STEP 2 へ進む →</button>'+
      '<button class="secondary-btn" onclick="resetPat(\'s1\')">このパターンをもう一度</button>');
    return;
  }
  const pool=shuffle(STEP1_PATTERNS[p2.s1pat].pool);
  if(!p2.s1qs.length)p2.s1qs=pool.slice(0,6);
  const q=p2.s1qs[p2.s1cur];
  el.innerHTML=RULE_REF+'<div class="msg-box">✏️ 【'+STEP1_PATTERNS[p2.s1pat].label+'】の練習！</div>'+renderQCard(q,p2.s1cur,6,'s1','を計算せよ');
}
function selectPat1(i){p2.s1pat=i;p2.s1cur=0;p2.s1evals=Array(6).fill(null);p2.s1done=false;p2.s1qs=[];renderP2();}

/* STEP2 多項式（たし引き＋分配法則→加減 まとめて練習） */
const STEP2_QS=shuffle([...POOL_P3,...POOL_P4B]).slice(0,15);
function renderS2(el){
  if(p2.s2done){
    el.innerHTML=stepDoneHtml('📝','STEP 2 完了！',STEP2_QS,p2.s2evals,
      '<button class="primary-btn" onclick="switchStep(2)">STEP 3 へ進む →</button>'+
      '<button class="secondary-btn" onclick="resetSN(\'s2\',15)">もう一度やる</button>');
    return;
  }
  const q=STEP2_QS[p2.s2cur];
  el.innerHTML=RULE_REF+'<div class="msg-box">📝 多項式の計算練習！分配法則→加減の問題も混ざっているよ。</div>'+renderQCard(q,p2.s2cur,STEP2_QS.length,'s2','を計算せよ');
}

/* STEP3 通分が必要な分数計算 */
const STEP3_QS=[...POOL_P5.slice(0,2),...shuffle(POOL_P5.slice(2))];
function renderS3(el){
  if(p2.s3done){
    el.innerHTML=stepDoneHtml('➗','STEP 3 完了！',STEP3_QS,p2.s3evals,
      '<button class="primary-btn" onclick="switchStep(3)">STEP 4 へ進む →</button>'+
      '<button class="secondary-btn" onclick="resetSN(\'s3\',15)">もう一度やる</button>');
    return;
  }
  const q=STEP3_QS[p2.s3cur];
  el.innerHTML=RULE_REF+'<div class="msg-box">➗ 頭でっかちの分数計算！分母をそろえてから計算しよう。</div>'+renderQCard(q,p2.s3cur,STEP3_QS.length,'s3','を計算せよ');
}

/* STEP4 ごちゃまぜ */
const STEP4_QS=shuffle([...POOL_P1,...POOL_P2,...POOL_P3,...POOL_P4,...POOL_P4B,...POOL_P5]).slice(0,15);
function renderS4(el){
  if(p2.s4done){
    el.innerHTML=stepDoneHtml('🔀','STEP 4 完了！',STEP4_QS,p2.s4evals,
      '<button class="primary-btn" onclick="switchPhase(3)">再テストに挑戦する →</button>'+
      '<button class="secondary-btn" onclick="resetSN(\'s4\',15)">もう一度やる</button>');
    return;
  }
  const q=STEP4_QS[p2.s4cur];
  el.innerHTML='<div class="msg-box">🔀 全パターンごちゃまぜ！どのルールか考えながら解こう。</div>'+renderQCard(q,p2.s4cur,STEP4_QS.length,'s4','を計算せよ');
}

function renderQCard(q,cur,total,key,direction){
  const isLast=cur===total-1;
  return pipHtml(total,cur)+
    '<div class="q-card">'+
      '<div class="q-num-badge">✏️ 問題'+(cur+1)+' / '+total+'</div>'+
      '<div class="q-formula">'+q.q+'</div>'+
      '<div class="q-direction">'+direction+' — 紙に書いてから確認しよう！</div>'+
      '<button class="reveal-btn" id="rb'+key+'" onclick="revealSN(\''+key+'\')">👀 答えを見る</button>'+
      '<button class="dontknow-btn" id="dk'+key+'" onclick="dkSN(\''+key+'\','+total+')">🤔 分からない</button>'+
      '<div class="ans-box" id="ab'+key+'"><div class="ans-label">答え</div><div class="ans-val">'+q.a+'</div><div class="ans-hint">💡 <span style="font-family:JetBrains Mono,monospace;line-height:2">'+q.hint+'</span></div></div>'+
      '<div class="eval-wrap" id="ew'+key+'"><div class="eval-q">自分の答えはどうだった？</div><div class="eval-row">'+
        '<button class="e-btn e-ok" id="eok'+key+'" onclick="setESN(\''+key+'\',\'ok\','+total+')">◯ できた</button>'+
        '<button class="e-btn e-half" id="ehalf'+key+'" onclick="setESN(\''+key+'\',\'half\','+total+')">△ 一部</button>'+
        '<button class="e-btn e-ng" id="eng'+key+'" onclick="setESN(\''+key+'\',\'ng\','+total+')">✕ 間違い</button>'+
      '</div></div>'+
    '</div>'+
    '<div class="nav-row"><span class="nav-count">'+(cur+1)+' / '+total+' 問目</span>'+
      '<button class="next-btn" id="nb'+key+'" onclick="nextSN(\''+key+'\','+total+')" disabled>'+(isLast?'結果を見る →':'次の問題 →')+'</button></div>';
}

function revealSN(key){document.getElementById('ab'+key).className='ans-box show';document.getElementById('ew'+key).className='eval-wrap show';document.getElementById('rb'+key).style.display='none';document.getElementById('dk'+key).style.display='none';}
function dkSN(key,len){p2[key+'evals'][p2[key+'cur']]='ng';revealSN(key);['ok','half','ng'].forEach(k=>document.getElementById('e'+k+key).className='e-btn e-'+k+(k==='ng'?' sel':''));document.getElementById('nb'+key).disabled=false;}
function setESN(key,v,len){p2[key+'evals'][p2[key+'cur']]=v;['ok','half','ng'].forEach(k=>document.getElementById('e'+k+key).className='e-btn e-'+k+(v===k?' sel':''));document.getElementById('nb'+key).disabled=false;}
function nextSN(key,len){if(p2[key+'cur']<len-1){p2[key+'cur']++;renderP2();}else{p2[key+'done']=true;renderP2();}}
function resetSN(key,len){p2[key+'cur']=0;p2[key+'evals']=Array(len).fill(null);p2[key+'done']=false;renderP2();}

/* ======= PHASE 3 再テスト ======= */
function renderP3(){
  const el=document.getElementById('phase3');
  if(p3.done){
    if(p3.evals.every(v=>v==='ok')){renderGoalAchieved(el);return;}
    let ok=0,half=0,ng=0;
    p3.evals.forEach(v=>{if(v==='ok')ok++;else if(v==='half')half++;else ng++;});
    let ok0=0,half0=0,ng0=0;
    p0.evals.forEach(v=>{if(v==='ok')ok0++;else if(v==='half')half0++;else ng0++;});
    const diff=(after,before)=>{const d=after-before;if(d>0)return '<span style="color:#27500a;font-weight:700">+'+d+'</span>';if(d<0)return '<span style="color:#72243e;font-weight:700">'+d+'</span>';return '<span style="color:#888">±0</span>';};
    const msgs=['まだ難しいところが残っています。STEPに戻って練習しよう。','着実に伸びています！もう一息。','大きく伸びています！','完璧！'];
    const mi=ok<=3?0:ok<=6?1:ok<=8?2:3;
    el.innerHTML=
      '<div class="done-wrap" style="text-align:left">'+
        '<div style="text-align:center;margin-bottom:1.25rem"><div class="done-icon">🎉</div><div class="done-title">再テスト 完了！</div></div>'+
        '<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:14px 16px;margin-bottom:1rem">'+
          '<div style="font-size:13px;font-weight:700;color:var(--grntext);margin-bottom:10px;text-align:center">📊 力試し → 再テスト の変化</div>'+
          '<div style="display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px 14px;font-size:13px;align-items:center">'+
            '<div style="text-align:center;color:#888;font-size:11px">力試し</div><div></div><div style="text-align:center;color:var(--grntext);font-size:11px;font-weight:700">再テスト</div><div style="text-align:center;font-size:11px;color:#888">変化</div>'+
            '<div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#27500a;font-weight:700">'+ok0+'</span> <span style="font-size:11px;color:#888">◯</span></div><div style="color:#aaa">→</div><div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#27500a;font-weight:700">'+ok+'</span> <span style="font-size:11px;color:#888">◯</span></div><div style="text-align:center">'+diff(ok,ok0)+'</div>'+
            '<div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#ba7517;font-weight:700">'+half0+'</span> <span style="font-size:11px;color:#888">△</span></div><div style="color:#aaa">→</div><div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#ba7517;font-weight:700">'+half+'</span> <span style="font-size:11px;color:#888">△</span></div><div style="text-align:center">'+diff(half0,half)+'</div>'+
            '<div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#d4537e;font-weight:700">'+ng0+'</span> <span style="font-size:11px;color:#888">✕</span></div><div style="color:#aaa">→</div><div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:#d4537e;font-weight:700">'+ng+'</span> <span style="font-size:11px;color:#888">✕</span></div><div style="text-align:center">'+diff(ng0,ng)+'</div>'+
          '</div>'+
        '</div>'+
        '<div style="font-size:11px;color:#888;text-align:center;margin-bottom:10px">※ 力試しと再テストは別の問題です。全体の調子の変化として見てね。</div>'+
        '<div class="msg-box">'+msgs[mi]+'</div>'+
        '<div class="done-btns">'+
          '<button class="primary-btn" onclick="switchPhase(2)">STEP練習に戻る →</button>'+
          '<button class="secondary-btn" onclick="resetP3()">もう一度再テストする</button>'+
        '</div>'+
      '</div>';
    return;
  }
  const q=TEST2[p3.cur];
  el.innerHTML=
    '<div class="msg-box">📍 練習の成果を確かめよう！</div>'+
    pipHtml(TEST2.length,p3.cur)+
    '<div class="q-card">'+
      '<div class="q-num-badge">🔁 問題'+(p3.cur+1)+' / '+TEST2.length+'</div>'+
      '<div class="q-formula">'+q.q+'</div>'+
      '<div class="q-direction">を計算せよ — まず紙に解いてみよう！</div>'+
      '<button class="reveal-btn" id="rb3" onclick="revealP3()">👀 答えを見る</button>'+
      '<button class="dontknow-btn" id="dk3" onclick="dkP3()">🤔 分からない</button>'+
      '<div class="ans-box" id="ab3"><div class="ans-label">答え</div><div class="ans-val">'+q.a+'</div><div class="ans-hint">💡 <span style="font-family:JetBrains Mono,monospace;line-height:2">'+q.hint+'</span></div></div>'+
      '<div class="eval-wrap" id="ew3"><div class="eval-q">自分の答えはどうだった？</div><div class="eval-row">'+
        '<button class="e-btn e-ok" id="eok3" onclick="setE3(\'ok\')">◯ できた</button>'+
        '<button class="e-btn e-half" id="ehalf3" onclick="setE3(\'half\')">△ 一部</button>'+
        '<button class="e-btn e-ng" id="eng3" onclick="setE3(\'ng\')">✕ 間違い</button>'+
      '</div></div>'+
    '</div>'+
    '<div class="nav-row"><span class="nav-count">'+(p3.cur+1)+' / '+TEST2.length+' 問目</span>'+
      '<button class="next-btn" id="nb3" onclick="nextP3()" disabled>'+(p3.cur===TEST2.length-1?'結果を見る →':'次の問題 →')+'</button></div>';
}
function revealP3(){revealTest('3');}
function dkP3(){dkTest('3',p3.evals,p3.cur);}
function setE3(v){setEvalTest(p3.evals,p3.cur,v,'3');}
function nextP3(){if(p3.cur<TEST2.length-1){p3.cur++;renderP3();}else{p3.done=true;renderP3();}}
function resetP3(){p3.evals=Array(10).fill(null);p3.cur=0;p3.done=false;renderP3();}

renderP0();
</script>
