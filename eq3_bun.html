<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次方程式の利用（中3）— まちがいLABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#eff6fc;min-height:100vh;padding:1.5rem 1rem}
.container{max-width:640px;margin:0 auto}
:root{
  --blu:#dcebf7;--blu2:#a8cae8;--blu3:#3b7fbf;--blu4:#265d8f;
  --blutext:#0e2e50;--blutext2:#254978;
  --peach:#faeeda;--peachtext:#633806;
  --rose:#fbeaf0;--rosetext:#72243e;
  --sage:#eaf3de;--sagetext:#27500a;
  --r20:20px;--r16:16px;--card-border:#a8cae8;
}
.back-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--card-border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--blutext2);cursor:pointer;margin-bottom:1rem;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;text-decoration:none}
.back-link:hover{background:var(--blu)}
.top-header{background:var(--blu);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;border:1.5px solid var(--blu2)}
.top-icon{width:48px;height:48px;border-radius:50%;background:var(--blu3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.top-title{font-size:18px;font-weight:700;color:var(--blutext)}
.top-sub{font-size:12px;color:var(--blutext2);margin-top:2px}
.top-badge{display:inline-block;background:#fff;border:1px solid var(--blu2);border-radius:999px;font-size:10px;font-weight:700;color:var(--blutext2);padding:2px 10px;margin-top:4px}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.ptab{padding:9px 4px;border-radius:999px;border:none;background:#c5dcf0;font-size:12px;color:#254978;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.18s;font-family:'Zen Maru Gothic',sans-serif}
.ptab span{display:block;font-size:10px;margin-top:2px;opacity:0.85}
.ptab.active{background:var(--blu3);color:#fff;font-weight:700}
.q-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.25rem;margin-bottom:1rem}
.q-num-badge{display:inline-flex;align-items:center;gap:5px;background:var(--blu);color:var(--blutext);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.q-formula{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:4px;line-height:1.8}
.q-direction{font-size:13px;color:#254978;margin-bottom:1rem}
.pip-row{display:flex;gap:5px;margin-bottom:1.25rem}
.pip{flex:1;height:8px;border-radius:999px}
.reveal-btn{display:inline-flex;align-items:center;gap:6px;background:var(--blu);color:var(--blutext);border:1.5px solid var(--blu2);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.reveal-btn:hover{background:var(--blu2)}
.dontknow-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;margin-left:8px}
.ans-box{background:#e7f0f9;border-radius:var(--r16);padding:1rem;margin-top:10px;display:none;border:1px solid var(--blu2)}
.ans-box.show{display:block}
.ans-label{font-size:11px;color:var(--blutext2);margin-bottom:4px;font-weight:700}
.ans-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--blutext);margin-bottom:6px;line-height:1.8}
.ans-hint{font-size:12px;color:var(--blutext2);line-height:1.8}
.eval-wrap{margin-top:1rem;display:none}
.eval-wrap.show{display:block}
.eval-q{font-size:13px;color:#254978;margin-bottom:8px}
.eval-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e-btn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;font-family:'Zen Maru Gothic',sans-serif}
.e-btn:hover{background:var(--blu)}
.e-ok.sel{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.e-half.sel{background:var(--peach);border-color:#ba7517;color:var(--peachtext)}
.e-ng.sel{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.nav-count{font-size:12px;color:#254978}
.next-btn{display:inline-flex;align-items:center;gap:6px;background:var(--blu3);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif}
.next-btn:hover{background:var(--blu4)}
.next-btn:disabled{opacity:0.3;cursor:default}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0.75rem}
.choice-btn{padding:12px 8px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all 0.2s;text-align:center}
.choice-btn:hover{background:var(--blu)}
.choice-correct{background:#dcebf7!important;border-color:#3b7fbf!important;color:#0e2e50!important;cursor:default}
.choice-wrong{background:#fbeaf0!important;border-color:#d4537e!important;color:#72243e!important;cursor:default}
.ox-result{text-align:center;font-size:18px;font-weight:700;padding:10px;border-radius:var(--r16);margin-bottom:0.75rem}
.ox-correct{background:#dcebf7;color:#0e2e50}
.ox-wrong{background:#fbeaf0;color:#72243e}
.step-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:1.25rem}
.snav{padding:8px 3px;border-radius:999px;border:none;background:#c5dcf0;font-size:11px;color:#254978;cursor:pointer;text-align:center;line-height:1.35;font-family:'Zen Maru Gothic',sans-serif}
.snav span{display:block;font-size:9px;margin-top:2px;opacity:0.8}
.snav.active{background:var(--blu3);color:#fff;font-weight:700}
.done-wrap{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.5rem}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--blu);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem}
.done-title{font-size:18px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:0.5rem}
.done-btns{display:flex;flex-direction:column;gap:8px}
.primary-btn{width:100%;padding:12px;border-radius:999px;border:none;background:var(--blu3);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif}
.primary-btn:hover{background:var(--blu4)}
.secondary-btn{width:100%;padding:11px;border-radius:999px;border:1.5px solid var(--blu2);background:#fff;color:#1a1a2e;font-size:14px;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif}
.secondary-btn:hover{background:var(--blu)}
.result-rows{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:0.75rem 1rem;margin-bottom:1rem}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--blu)}
.rrow:last-child{border-bottom:none}
.rformula{flex:1;color:#1a1a2e;font-size:12px;line-height:1.5}
.rbadge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rb-ok{background:var(--sage);color:var(--sagetext)}
.rb-half{background:var(--peach);color:var(--peachtext)}
.rb-ng{background:var(--rose);color:var(--rosetext)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.stat-c{background:#eff6fc;border-radius:var(--r16);padding:0.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-l{font-size:11px;color:#254978}
.msg-box{font-size:13px;color:var(--blutext2);line-height:1.7;padding:10px 14px;background:var(--blu);border-radius:var(--r16);margin-bottom:1rem;border:1px solid var(--blu2)}
.sa-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:10px;line-height:1.5;margin-top:1rem}
.sa-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:0.5rem}
.sa-btn{text-align:left;padding:11px 14px;border-radius:var(--r16);border:1.5px solid var(--blu2);background:#fff;font-size:13px;color:#1a1a2e;cursor:pointer;line-height:1.5;font-family:'Zen Maru Gothic',sans-serif}
.sa-btn:hover{background:var(--blu)}
.sa-btn.sel{background:var(--blu);border-color:var(--blu3);color:var(--blutext);font-weight:700}
.rule-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--blu);border:1.5px solid var(--blu2);border-radius:var(--r16);cursor:pointer;font-size:13px;font-weight:700;color:var(--blutext);margin-bottom:0.75rem}
.rule-toggle:hover{background:var(--blu2)}
.rule-body{display:none;background:#e7f0f9;border:1px solid var(--blu2);border-radius:var(--r16);padding:1rem;margin-bottom:0.75rem;font-size:11px}
.rule-body.open{display:block}
.rule-sec{margin-bottom:10px}
.rule-sec:last-child{margin-bottom:0}
.rule-sec-title{font-weight:700;color:var(--blutext);margin-bottom:6px;font-size:12px}
.rule-row{display:flex;gap:8px;padding:4px 0;border-bottom:0.5px solid var(--blu2);line-height:1.6}
.rule-row:last-child{border-bottom:none}
.rule-label{font-weight:700;color:var(--blutext);min-width:90px;font-size:11px;flex-shrink:0}
.rule-ex{font-family:'JetBrains Mono',monospace;color:var(--blutext2);font-size:11px}
.pat-grid1{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pat-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:0.75rem;cursor:pointer;transition:all 0.15s}
.pat-card:hover{background:var(--blu)}
.pat-name{font-size:12px;font-weight:700;color:var(--blutext);margin-bottom:4px}
.pat-ex{font-size:11px;color:var(--blutext2)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:0.85em;line-height:1.1}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 3px;text-align:center}
.frac .den{padding:0 3px;text-align:center}
</style>
</head>
<body>
<div class="container">
<a class="back-link" href="index.html">← まちがいLABO トップへ</a>
<div class="top-header">
  <div class="top-icon">x²</div>
  <div>
    <div class="top-title">二次方程式の利用</div>
    <div class="top-sub">力試し → 分析 → 練習 → 再テスト</div>
    <span class="top-badge">中3・文章題</span>
  </div>
</div>
<div class="phase-tabs">
  <button class="ptab active" id="tab0" onclick="goPhase(0)">力試し<span>テスト</span></button>
  <button class="ptab" id="tab1" onclick="goPhase(1)">自己<span>分析</span></button>
  <button class="ptab" id="tab2" onclick="goPhase(2)">STEP<span>練習</span></button>
  <button class="ptab" id="tab3" onclick="goPhase(3)">再<span>テスト</span></button>
</div>
<div id="app"></div>
</div>
<script>
const sh = a => [...a].sort(()=>Math.random()-0.5);
const fr = (n,d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const pipHtml = (total,cur) =>
  '<div class="pip-row">'+Array(total).fill(0).map((_,i)=>
    `<div class="pip" style="background:${i<cur?'#3b7fbf':i===cur?'#a8cae8':'#c5dcf0'}"></div>`).join('')+'</div>';

// ===== 問題プール =====

// STEP1: 二次方程式を立てる練習（解かない）
const PS1=[
  {q:'ある数 x を 2 乗すると 25 になる。方程式で表せ',
   a:'x² = 25',
   hint:'「2 乗」→ x²、「〜になる」→ ＝'},
  {q:'ある数 x を 2 乗して 3 加えると 12 になる。方程式で表せ',
   a:'x² + 3 = 12',
   hint:'x² + 3 = 12'},
  {q:'ある数 x を 2 乗すると、x の 4 倍に等しくなる。方程式で表せ',
   a:'x² = 4x',
   hint:'x² と 4x が等しい'},
  {q:'ある数 x を 2 乗して 3x を引くと 10 になる。方程式で表せ',
   a:'x² − 3x = 10',
   hint:'x² − 3x = 10'},
  {q:'ある数 x とその 2 乗の和が 20 になる。方程式で表せ',
   a:'x + x² = 20（または x² + x = 20）',
   hint:'x + x² = 20'},
  {q:'連続する 2 つの整数（小さい方を x）の積が 30 になる。方程式で表せ',
   a:'x(x + 1) = 30',
   hint:'2 つは x と x+1、その積 = 30'},
  {q:'ある数 x を 2 乗した数は、その数の 5 倍より 6 大きい。方程式で表せ',
   a:'x² = 5x + 6',
   hint:'左辺 x²、右辺「5x より 6 大きい」= 5x + 6'},
  {q:'縦 x cm、横 (x + 3) cm の長方形の面積が 40 cm²。方程式で表せ',
   a:'x(x + 3) = 40',
   hint:'面積 = 縦 × 横'},
  {q:'1 辺 x cm の正方形の面積が 49 cm²。方程式で表せ',
   a:'x² = 49',
   hint:'面積 = 1 辺 × 1 辺'},
  {q:'ある数 x に 2 を加えた数を 2 乗すると 16 になる。方程式で表せ',
   a:'(x + 2)² = 16',
   hint:'「x に 2 を加えた数」= x+2、それを 2 乗'},
  {q:'ある数 x を 2 乗して 2x を加えると 15 になる。方程式で表せ',
   a:'x² + 2x = 15',
   hint:'x² + 2x = 15'},
  {q:'連続する 2 つの正の偶数（小さい方を x）の積が 48。方程式で表せ',
   a:'x(x + 2) = 48',
   hint:'連続する偶数は 2 とび: x と x+2'},
];

// STEP2: パターン別に方程式を立てる練習
// 面積パターン（立式）
const PT_AREA_S=[
  {q:'縦の長さが x cm、横の長さが縦より 3 cm 長い長方形がある。面積が 40 cm² のとき、方程式を立てよ。',
   a:'x(x + 3) = 40',
   hint:'横 = x+3。面積 = 縦 × 横 = x(x+3) = 40'},
  {q:'1 辺 x cm の正方形の面積が、1 辺の長さの 6 倍に等しい。方程式を立てよ。',
   a:'x² = 6x',
   hint:'面積 = x²、1辺の6倍 = 6x'},
  {q:'縦 (x + 2) cm、横 (x + 5) cm の長方形の面積が 40 cm²。方程式を立てよ。',
   a:'(x + 2)(x + 5) = 40',
   hint:'面積 = 縦 × 横 = (x+2)(x+5) = 40'},
  {q:'横の長さが縦の 2 倍の長方形がある。縦を x cm とすると、面積が 72 cm² になる。方程式を立てよ。',
   a:'x × 2x = 72（または 2x² = 72）',
   hint:'横 = 2x。面積 = 縦 × 横 = 2x² = 72'},
  {q:'縦 10 m、横 15 m の長方形の土地の周りに幅 x m の道をつけたら、道の面積が 74 m² になった。方程式を立てよ。',
   a:'(10 + 2x)(15 + 2x) − 10 × 15 = 74',
   hint:'外側の長方形の面積 − 元の面積 = 道の面積'},
];
// 整数パターン（立式）
const PT_INT_S=[
  {q:'連続する 2 つの正の整数がある。小さい方を x とすると、その積が 42 になる。方程式を立てよ。',
   a:'x(x + 1) = 42',
   hint:'2 つは x と x+1、その積が 42'},
  {q:'連続する 2 つの正の整数の平方の和が 25。小さい方を x として方程式を立てよ。',
   a:'x² + (x + 1)² = 25',
   hint:'「平方の和」= x² + (x+1)²'},
  {q:'ある正の整数 x を 2 乗した数は、その数の 3 倍より 4 大きい。方程式を立てよ。',
   a:'x² = 3x + 4',
   hint:'x² は「3x より 4 大きい」= 3x + 4'},
  {q:'連続する 2 つの正の奇数の積が 63。小さい方を x として方程式を立てよ。',
   a:'x(x + 2) = 63',
   hint:'連続する奇数は 2 とび: x と x+2'},
  {q:'大小 2 つの正の整数がある。大きい方は小さい方より 5 大きく、積が 84。小さい方を x として方程式を立てよ。',
   a:'x(x + 5) = 84',
   hint:'大 = x+5、積 = x(x+5) = 84'},
];
// 直方体パターン（立式）
const PT_BOX_S=[
  {q:'1 辺 20 cm の正方形の紙の四隅から、1 辺 x cm の正方形を切り取り、ふたのない直方体の箱を作る。底面の面積が 144 cm² になる。方程式を立てよ。',
   a:'(20 − 2x)² = 144',
   hint:'底面は 1 辺 (20 − 2x) cm の正方形。面積 = (20−2x)²'},
  {q:'1 辺 12 cm の正方形の紙の四隅から、1 辺 x cm の正方形を切り取り、ふたのない直方体の箱を作る。底面の面積が 64 cm² になる。方程式を立てよ。',
   a:'(12 − 2x)² = 64',
   hint:'底面は 1 辺 (12 − 2x) cm の正方形'},
  {q:'縦 16 cm、横 20 cm の長方形の紙の四隅から、1 辺 x cm の正方形を切り取り、ふたのない直方体の箱を作る。底面積が 192 cm² になる。方程式を立てよ。',
   a:'(16 − 2x)(20 − 2x) = 192',
   hint:'底面は 縦 (16−2x)、横 (20−2x) の長方形'},
  {q:'1 辺 18 cm の正方形の紙の四隅から 1 辺 x cm の正方形を切り取り、ふたのない直方体の箱を作る。底面積が 100 cm² のとき、方程式を立てよ。',
   a:'(18 − 2x)² = 100',
   hint:'底面は 1 辺 (18 − 2x) cm の正方形'},
  {q:'縦 10 cm、横 14 cm の長方形の紙の四隅から 1 辺 x cm の正方形を切り取り、ふたのない直方体の箱を作る。底面積が 60 cm² のとき、方程式を立てよ。',
   a:'(10 − 2x)(14 − 2x) = 60',
   hint:'底面は 縦 (10−2x)、横 (14−2x) の長方形'},
];
// 動点パターン（立式）
const PT_MOV_S=[
  {q:'1 辺 10 cm の正方形 ABCD で、点 P は A を出発して辺 AB 上を毎秒 1 cm で B まで進む。P が A を出発してから x 秒後、△APD の面積が 15 cm² になる。方程式を立てよ。（AD = 10 cm、0 < x < 10）',
   a:fr('1','2')+' × x × 10 = 15（または 5x = 15）',
   hint:'△APD の面積 = '+fr('1','2')+' × AP × AD = '+fr('1','2')+' × x × 10'},
  {q:'AB = 12 cm、BC = 8 cm の長方形 ABCD で、点 P は A を出発して AB 上を毎秒 2 cm で B に向かい、点 Q は B を出発して BC 上を毎秒 1 cm で C に向かって進む。同時に出発してから x 秒後、△PBQ の面積が 8 cm² になる。方程式を立てよ。（0 < x < 6）',
   a:fr('1','2')+' × (12 − 2x) × x = 8（または x(12 − 2x) = 16）',
   hint:'x 秒後、PB = 12 − 2x、BQ = x。△PBQ = '+fr('1','2')+' × PB × BQ'},
  {q:'1 辺 8 cm の正方形 ABCD で、点 P は A を出発して AB 上を毎秒 1 cm で、点 Q は同時に A を出発して AD 上を毎秒 2 cm で進む。x 秒後、△APQ の面積が 12 cm² になる。方程式を立てよ。（0 < x < 4）',
   a:fr('1','2')+' × x × 2x = 12（または x² = 12）',
   hint:'△APQ = '+fr('1','2')+' × AP × AQ = '+fr('1','2')+' × x × 2x'},
  {q:'AB = 10 cm、AD = 6 cm の長方形 ABCD で、点 P は A を出発して AB 上を毎秒 1 cm で進む。x 秒後、△PBC（P, B, C を頂点とする三角形）の面積が 12 cm² になる。方程式を立てよ。（0 < x < 10）',

// ===== 共通部品 =====
function mkStat(ev){
  const ok=ev.filter(v=>v==='ok').length,half=ev.filter(v=>v==='half').length,ng=ev.filter(v=>v==='ng').length;
  return `<div class="stat-row">
    <div class="stat-c"><div class="stat-n" style="color:#27500a">${ok}</div><div class="stat-l">◯ できた</div></div>
    <div class="stat-c"><div class="stat-n" style="color:#ba7517">${half}</div><div class="stat-l">△ 一部</div></div>
    <div class="stat-c"><div class="stat-n" style="color:#d4537e">${ng}</div><div class="stat-l">✕ 間違い</div></div>
  </div>`;
}
function mkRows(qs,ev){
  const L={ok:'◯',half:'△',ng:'✕'},C={ok:'rb-ok',half:'rb-half',ng:'rb-ng'};
  return '<div class="result-rows">'+qs.map((q,i)=>
    `<div class="rrow"><span class="rformula">${q.q}</span><span class="rbadge ${C[ev[i]||'ng']}">${L[ev[i]||'ng']}</span></div>`
  ).join('')+'</div>';
}
function mkCompare(evBefore,evAfter){
  const cnt=ev=>['ok','half','ng'].map(k=>ev.filter(v=>v===k).length);
  const [ok0,half0,ng0]=cnt(evBefore), [ok,half,ng]=cnt(evAfter);
  const diff=(after,before)=>{const d=after-before;if(d>0)return `<span style="color:#27500a;font-weight:700">+${d}</span>`;if(d<0)return `<span style="color:#72243e;font-weight:700">${d}</span>`;return `<span style="color:#888">±0</span>`;};
  const row=(label,b,a,color,d)=>`<div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:${color};font-weight:700">${b}</span> <span style="font-size:11px;color:#888">${label}</span></div><div style="color:#aaa">→</div><div style="text-align:center;font-family:JetBrains Mono,monospace"><span style="color:${color};font-weight:700">${a}</span> <span style="font-size:11px;color:#888">${label}</span></div><div style="text-align:center">${d}</div>`;
  return `<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:14px 16px;margin-bottom:1rem">
    <div style="font-size:13px;font-weight:700;color:var(--blutext);margin-bottom:10px;text-align:center">📊 力試し → 再テスト の変化</div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px 14px;font-size:13px;align-items:center">
      <div style="text-align:center;color:#888;font-size:11px">力試し</div><div></div><div style="text-align:center;color:var(--blutext);font-size:11px;font-weight:700">再テスト</div><div style="text-align:center;font-size:11px;color:#888">変化</div>
      ${row('◯',ok0,ok,'#27500a',diff(ok,ok0))}
      ${row('△',half0,half,'#ba7517',diff(half0,half))}
      ${row('✕',ng0,ng,'#d4537e',diff(ng0,ng))}
    </div>
  </div>
  <div style="font-size:11px;color:#888;text-align:center;margin-bottom:10px">※ 力試しと再テストは別の問題です。全体の調子の変化として見てね。</div>`;
}
function mkDone(icon,title,qs,ev,btns){

    <div style="text-align:center;margin-bottom:1rem"><div class="done-icon">${icon}</div><div class="done-title">${title}</div></div>

function renderTest(qs,state,isFirst){
  const el=document.getElementById('app');
  if(state.done){
    const perfect=state.ev.every(v=>v==='ok');
    // タイムアタックモード完了
    if(window._taMode&&isFirst){
      window._taMode=false;
      renderTAResult(el,state);
      return;
    }
    if(perfect){renderGoalAchieved(el,isFirst);return;}
    if(isFirst){
      el.innerHTML=`<div class="msg-box">📍 テスト完了！</div>${mkStat(state.ev)}${mkRows(qs,state.ev)}<div class="done-btns"><button class="primary-btn" onclick="goPhase(1)">自己分析へ進む →</button></div>`;
    }else{
      el.innerHTML=`<div class="msg-box">🎉 再テスト完了！</div>${mkCompare(t1.ev,state.ev)}${mkRows(qs,state.ev)}<div class="done-btns">
        <button class="primary-btn" onclick="goPhase(2)">STEP練習に戻る →</button>
        <button class="secondary-btn" onclick="resetT2()">もう一度再テストする</button>
      </div>`;
    }
    return;
  }
  const q=qs[state.cur];
  const isLast=state.cur===qs.length-1;
  const nfn=isFirst?'nextT1':'nextT2';
  let body='';
  if(q.choices){
    const shuffled=sh(q.choices.map((c,i)=>({c,ok:i===0})));
    _ox['test']=shuffled;
    body=`<div class="q-direction">正しい式を選べ</div>
      <div class="choice-grid">${shuffled.map((it,i)=>
        `<button class="choice-btn" id="txb${i}" onclick="pickOXTest(${i},'${nfn}')">${it.c}</button>`).join('')}</div>
      <div id="txres"></div>
      <div class="ans-box" id="txans"><div class="ans-hint">💡 ${q.hint}</div></div>
      <div id="txnav" style="display:none">
        <div class="nav-row"><span class="nav-count">${state.cur+1} / ${qs.length} 問目</span>
          <button class="next-btn" onclick="${nfn}()">${isLast?'結果を見る →':'次の問題 →'}</button></div></div>`;
  } else {
    body=`<div class="q-direction">まず紙に解いてみよう！</div>
      <button class="reveal-btn" id="trb" onclick="revTest()">👀 答えを見る</button>
      <button class="dontknow-btn" onclick="dkTest('${nfn}')">🤔 分からない</button>
      <div class="ans-box" id="tans"><div class="ans-label">答え</div><div class="ans-val">${q.a}</div><div class="ans-hint">💡 ${q.hint}</div></div>
      <div class="eval-wrap" id="tev">
        <div class="eval-q">自分の答えはどうだった？</div>
        <div class="eval-row">
          <button class="e-btn e-ok" id="te-ok" onclick="evTest('ok','${nfn}')">◯ できた</button>
          <button class="e-btn e-half" id="te-half" onclick="evTest('half','${nfn}')">△ 一部</button>
          <button class="e-btn e-ng" id="te-ng" onclick="evTest('ng','${nfn}')">✕ 間違い</button>
        </div>
      </div>
      <div class="nav-row"><span class="nav-count">${state.cur+1} / ${qs.length} 問目</span>
        <button class="next-btn" id="tnb" onclick="${nfn}()" disabled>${isLast?'結果を見る →':'次の問題 →'}</button></div>`;
  }
  el.innerHTML=`<div class="msg-box">📍 テストは自分の現在地を知るためのもの。正直に◯△✕をつけよう！</div>
    ${pipHtml(qs.length,state.cur)}

      <div class="q-num-badge">📝 問題${state.cur+1} / ${qs.length}</div>
      <div class="q-formula">${q.q}</div>

    </div>`;

let _restTimer=null;
let _restRemain=0;
let _restPaused=false;
function startRest(){
  const min=Math.min(15,Math.max(1,parseInt(document.getElementById('rest-min').value)||5));
  _restRemain=min*60;
  _restPaused=false;
  document.getElementById('rest-start-btn').style.display='none';
  document.getElementById('rest-min').disabled=true;
  document.getElementById('rest-timer').style.display='block';
  updateRestDisplay();
  if(_restTimer)clearInterval(_restTimer);
  _restTimer=setInterval(()=>{
    if(_restPaused)return;
    _restRemain--;
    updateRestDisplay();
    if(_restRemain<=0){
      clearInterval(_restTimer);
      document.getElementById('rest-timer').style.display='none';
      document.getElementById('rest-done').style.display='block';
    }
  },1000);
}
function updateRestDisplay(){
  const el=document.getElementById('rest-display');
  if(!el)return;
  const m=Math.floor(_restRemain/60);
  const s=_restRemain%60;
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function pauseRest(){
  _restPaused=!_restPaused;
  const btn=document.getElementById('rest-pause-btn');

}

  const timeStr=m+'分'+s+'秒';

  if(prev&&cmp){
    // 比較
    const [pm,ps]=prev.replace('分',':').replace('秒','').split(':').map(Number);

}

function saQ(qn,i){
  if(qn===1){sa.q1.has(i)?sa.q1.delete(i):sa.q1.add(i);}
  else if(qn===2){sa.q2.has(i)?sa.q2.delete(i):sa.q2.add(i);}
  else{sa.q3=i;}
  renderSA();
}
function saGo(){if(!sa.q1.size||sa.q3===null)return;st.step=sa.q3;goPhase(2);}

function renderSTEP(){
  const el=document.getElementById('app');
  el.innerHTML=`

    </div>

  renderSC();
}
function switchST(i){st.step=i;renderSTEP();}
function renderSC(){
  const el=document.getElementById('sc');
  // STEP0=解き方、STEP1=パターン別立式（旧S2）、STEP2=パターン別解く（旧S3）、STEP3=混合（旧S4）
  if(st.step===0)renderS0(el);

// STEP0 ルール確認

      {label:'連続する偶数・奇数', rule:'2 とびになるので、小さい方を x とおくと、もう 1 つは x + 2',                          ex:'2 つの積 = 63（奇数）→ x(x+2) = 63'},

      {label:'底面積（長方形）',   rule:'(縦 − 2x)(横 − 2x)',                                                                ex:'縦 16、横 20 → 底面積 = (16−2x)(20−2x)'},
      {label:'高さ',             rule:'切り取った正方形の 1 辺 = x',                                                          ex:'高さ = x cm'},
      {label:'x の範囲',          rule:'0 < x < 元の辺の半分（切り取りすぎない）',                                            ex:'元 20 cm なら 0 < x < 10'},
    ]},
    {title:'🏃 動点の考え方',items:[

function ruleRef(sections){
  const all={
    basic:`<div class="rule-sec">
      <div class="rule-sec-title">解き方の流れ</div>
      <div class="rule-row"><span class="rule-label">1. xにおく</span><span class="rule-ex">求めるものを x とおく</span></div>

      <div class="rule-row"><span class="rule-label">4. 吟味</span><span class="rule-ex">問題に合う解を選ぶ（長さ・個数は正、範囲に合うかも確認）</span></div>
    </div>`,
    area:`<div class="rule-sec">
      <div class="rule-sec-title">面積の公式</div>
      <div class="rule-row"><span class="rule-label">長方形</span><span class="rule-ex">面積 = 縦 × 横</span></div>
      <div class="rule-row"><span class="rule-label">正方形</span><span class="rule-ex">面積 = 1辺 × 1辺 = (1辺)²</span></div>
      <div class="rule-row"><span class="rule-label">三角形</span><span class="rule-ex">面積 = '+fr('1','2')+' × 底辺 × 高さ</span></div>
      <div class="rule-row"><span class="rule-label">道の面積</span><span class="rule-ex">外側全体 − 元の土地 = 道の面積</span></div>
    </div>`,
    integer:`<div class="rule-sec">
      <div class="rule-sec-title">整数のおき方</div>
      <div class="rule-row"><span class="rule-label">連続する整数</span><span class="rule-ex">2つ: x, x+1　　3つ: x−1, x, x+1</span></div>
      <div class="rule-row"><span class="rule-label">連続する偶数・奇数</span><span class="rule-ex">2つ: x, x+2（どちらも2とび）</span></div>
      <div class="rule-row"><span class="rule-label">平方の和</span><span class="rule-ex">x² + (x+1)²</span></div>
      <div class="rule-row"><span class="rule-label">積</span><span class="rule-ex">x(x+1)、x(x+2) など</span></div>
    </div>`,
    box:`<div class="rule-sec">
      <div class="rule-sec-title">直方体（四隅を切り取る）</div>
      <div class="rule-row"><span class="rule-label">底面の1辺</span><span class="rule-ex">元の辺 − 2x（両端から x ずつ切るので）</span></div>
      <div class="rule-row"><span class="rule-label">正方形の紙</span><span class="rule-ex">底面積 = (元−2x)²</span></div>
      <div class="rule-row"><span class="rule-label">長方形の紙</span><span class="rule-ex">底面積 = (縦−2x)(横−2x)</span></div>
      <div class="rule-row"><span class="rule-label">高さ</span><span class="rule-ex">切り取った正方形の1辺 = x</span></div>
      <div class="rule-row"><span class="rule-label">x の範囲</span><span class="rule-ex">0 < x < 元の辺の半分（切り取りすぎない）</span></div>
    </div>`,
    move:`<div class="rule-sec">
      <div class="rule-sec-title">動点の考え方</div>
      <div class="rule-row"><span class="rule-label">x 秒後の位置</span><span class="rule-ex">動いた距離 = 速さ × x</span></div>
      <div class="rule-row"><span class="rule-label">残りの長さ</span><span class="rule-ex">元の辺 − 動いた距離</span></div>
      <div class="rule-row"><span class="rule-label">三角形の面積</span><span class="rule-ex">'+fr('1','2')+' × 底辺 × 高さ</span></div>
      <div class="rule-row"><span class="rule-label">範囲チェック</span><span class="rule-ex">動点が辺の上にある間だけ（例: 0<x<辺の長さ/速さ）</span></div>
    </div>`,
  };
  const body=sections.map(k=>all[k]||'').join('');
  return `<div class="rule-toggle" onclick="toggleRule()">📖 ルール表を見る <span id="rule-arrow">▼</span></div>
  <div class="rule-body" id="rule-body">${body}</div>`;
}
function toggleRule(){
  const b=document.getElementById('rule-body');

}

// 通常カード
function renderNCard(el,q,cur,total,key){
  const isLast=cur===total-1;
  el.innerHTML+=pipHtml(total,cur)+`
    <div class="q-card">
      <div class="q-num-badge">✏️ 問題${cur+1} / ${total}</div>
      <div class="q-formula">${q.q}</div>
      <div class="q-direction">紙に書いてから確認しよう！</div>
      <button class="reveal-btn" id="rb${key}" onclick="revN('${key}')">👀 答えを見る</button>
      <button class="dontknow-btn" onclick="dkN('${key}',${total})">🤔 分からない</button>
      <div class="ans-box" id="ab${key}"><div class="ans-label">答え</div><div class="ans-val">${q.a}</div><div class="ans-hint">💡 ${q.hint}</div></div>
      <div class="eval-wrap" id="ew${key}">
        <div class="eval-q">自分の答えはどうだった？</div>
        <div class="eval-row">
          <button class="e-btn e-ok" id="eo${key}" onclick="evN('${key}','ok',${total})">◯ できた</button>
          <button class="e-btn e-half" id="eh${key}" onclick="evN('${key}','half',${total})">△ 一部</button>
          <button class="e-btn e-ng" id="en${key}" onclick="evN('${key}','ng',${total})">✕ 間違い</button>
        </div>
      </div>
    </div>
    <div class="nav-row"><span class="nav-count">${cur+1} / ${total} 問目</span>
      <button class="next-btn" id="nb${key}" onclick="nxN('${key}',${total})" disabled>${isLast?'結果を見る →':'次の問題 →'}</button></div>`;
}
function revN(k){document.getElementById('ab'+k).className='ans-box show';document.getElementById('ew'+k).className='eval-wrap show';document.getElementById('rb'+k).style.display='none';}
function dkN(k,t){st[k+'ev'][st[k+'cur']]='ng';revN(k);document.getElementById('en'+k).className='e-btn e-ng sel';document.getElementById('nb'+k).disabled=false;}
function evN(k,v,t){st[k+'ev'][st[k+'cur']]=v;['ok','half','ng'].forEach(n=>document.getElementById('e'+n[0]+k).className='e-btn e-'+n+(v===n?' sel':''));document.getElementById('nb'+k).disabled=false;}
function nxN(k,t){st[k+'cur']<t-1?st[k+'cur']++:st[k+'done']=true;renderSTEP();}

// 選択肢カード
function renderOXCard(el,q,cur,total,key){
  const shuffled=sh(q.choices.map((c,i)=>({c,ok:i===0})));
  _ox[key]=shuffled;
  const isLast=cur===total-1;
  el.innerHTML+=pipHtml(total,cur)+`
    <div class="q-card">
      <div class="q-num-badge">✏️ 問題${cur+1} / ${total}</div>
      <div class="q-formula">${q.q}</div>
      <div class="q-direction">正しい式を選べ</div>
      <div class="choice-grid">
        ${shuffled.map((it,i)=>`<button class="choice-btn" id="oxb${i}" onclick="pickOX('${key}',${i},${total})">${it.c}</button>`).join('')}
      </div>
      <div id="oxres${key}"></div>
      <div class="ans-box" id="ab${key}"><div class="ans-hint">💡 ${q.hint}</div></div>
      <div id="ewnav${key}" style="display:none">
        <div class="nav-row"><span class="nav-count">${cur+1} / ${total} 問目</span>
          <button class="next-btn" onclick="nxN('${key}',${total})">${isLast?'結果を見る →':'次の問題 →'}</button></div>
      </div>
    </div>`;
}
function pickOX(key,i,total){
  const s=_ox[key];if(!s)return;
  const ok=s[i].ok;
  st[key+'ev'][st[key+'cur']]=ok?'ok':'ng';
  s.forEach((_,j)=>{
    const b=document.getElementById('oxb'+j);if(!b)return;
    if(s[j].ok)b.className='choice-btn choice-correct';
    else if(j===i&&!ok)b.className='choice-btn choice-wrong';
    b.onclick=null;
  });
  const res=document.getElementById('oxres'+key);
  if(res){res.className='ox-result '+(ok?'ox-correct':'ox-wrong');res.textContent=ok?'✓ 正解！':'✗ 不正解';}
  document.getElementById('ab'+key).className='ans-box show';
  document.getElementById('ewnav'+key).style.display='block';
}

renderApp();
</script>
</body>
</html>
