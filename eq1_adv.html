<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方程式・応用編（中1）— まちがいLABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Maru Gothic',sans-serif;background:#f2faf4;min-height:100vh;padding:1.5rem 1rem}
.container{max-width:640px;margin:0 auto}
:root{
  --grn:#d8f3e0;--grn2:#aee4bc;--grn3:#52b069;--grn4:#368a4a;
  --grntext:#1a4d28;--grntext2:#2d7a42;
  --peach:#faeeda;--peachtext:#633806;
  --rose:#fbeaf0;--rosetext:#72243e;
  --sage:#eaf3de;--sagetext:#27500a;
  --r20:20px;--r16:16px;--card-border:#aee4bc;
}
.back-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--card-border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--grntext2);cursor:pointer;margin-bottom:1rem;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;text-decoration:none}
.back-link:hover{background:var(--grn)}
.top-header{background:var(--grn);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;border:1.5px solid var(--grn2)}
.top-icon{width:48px;height:48px;border-radius:50%;background:var(--grn3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.top-title{font-size:18px;font-weight:700;color:var(--grntext)}
.top-sub{font-size:12px;color:var(--grntext2);margin-top:2px}
.top-badge{display:inline-block;background:#fff;border:1px solid var(--grn2);border-radius:999px;font-size:10px;font-weight:700;color:var(--grntext2);padding:2px 10px;margin-top:4px}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.25rem}
.ptab{padding:9px 4px;border-radius:999px;border:none;background:#c8ecd1;font-size:12px;color:#1a4d28;cursor:pointer;text-align:center;line-height:1.35;transition:all 0.18s;font-family:'Zen Maru Gothic',sans-serif;font-weight:400}
.ptab span{display:block;font-size:10px;margin-top:2px;opacity:0.85}
.ptab.active{background:var(--grn3);color:#fff;font-weight:700}
.q-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.25rem;margin-bottom:1rem}
.q-num-badge{display:inline-flex;align-items:center;gap:5px;background:var(--grn);color:var(--grntext);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.q-formula{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#1a1a2e;margin-bottom:4px}
.q-direction{font-size:13px;color:var(--grntext2);margin-bottom:1rem}
.pip-row{display:flex;gap:5px;margin-bottom:1.25rem}
.pip{flex:1;height:8px;border-radius:999px}
.reveal-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn);color:var(--grntext);border:1.5px solid var(--grn2);border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.reveal-btn:hover{background:var(--grn2)}
.dontknow-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500;margin-left:8px}
.ans-box{background:var(--grn);border-radius:var(--r16);padding:1rem;margin-top:10px;display:none;border:1px solid var(--grn2)}
.ans-box.show{display:block}
.ans-label{font-size:11px;color:var(--grntext2);margin-bottom:4px;font-weight:700}
.ans-val{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--grntext);margin-bottom:6px}
.ans-hint{font-size:12px;color:var(--grntext2);line-height:1.7}
.eval-wrap{margin-top:1rem;display:none}
.eval-wrap.show{display:block}
.eval-q{font-size:13px;color:var(--grntext2);margin-bottom:8px}
.eval-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e-btn{padding:10px 6px;border-radius:var(--r16);border:1.5px solid var(--card-border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.e-btn:hover{background:var(--grn)}
.e-ok.sel{background:var(--sage);border-color:#639922;color:var(--sagetext)}
.e-half.sel{background:var(--peach);border-color:#ba7517;color:var(--peachtext)}
.e-ng.sel{background:var(--rose);border-color:#d4537e;color:var(--rosetext)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.nav-count{font-size:12px;color:var(--grntext2)}
.next-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grn3);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.next-btn:hover{background:var(--grn4)}
.next-btn:disabled{opacity:0.3;cursor:default}
.step-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:1.25rem}
.snav{padding:8px 3px;border-radius:999px;border:none;background:#c8ecd1;font-size:11px;color:var(--grntext2);cursor:pointer;text-align:center;line-height:1.35;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.snav span{display:block;font-size:10px;margin-top:2px;opacity:0.8}
.snav.active{background:var(--grn3);color:#fff;font-weight:700}
.sub-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.subbtn{padding:10px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#fff;font-size:13px;font-weight:700;color:var(--grntext);cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.subbtn:hover{background:var(--grn)}
.subbtn.active{background:var(--grn3);color:#fff;border-color:var(--grn3)}
.formula-ref{background:var(--grn);border-radius:var(--r16);padding:1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--grn2)}
.formula-ref-title{font-size:11px;color:var(--grntext2);margin-bottom:8px;font-weight:700}
.frow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--grn2);font-size:12px}
.frow:last-child{border-bottom:none}
.fname{font-weight:700;color:var(--grntext);min-width:110px;flex-shrink:0}
.fexpr{font-family:'JetBrains Mono',monospace;color:var(--grntext2)}
.rule-card{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem;margin-bottom:0.75rem}
.rule-title{font-size:13px;font-weight:700;color:var(--grntext);margin-bottom:6px}
.rule-ex{font-size:13px;font-family:'JetBrains Mono',monospace;color:#1a1a2e;line-height:1.8}
.rule-note{font-size:11px;color:var(--grntext2);margin-top:4px;line-height:1.6}
.done-wrap{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:1.5rem}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--grn);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem}
.done-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px;text-align:center}
.done-btns{display:flex;flex-direction:column;gap:8px}
.primary-btn{width:100%;padding:12px;border-radius:999px;border:none;background:var(--grn3);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.primary-btn:hover{background:var(--grn4)}
.secondary-btn{width:100%;padding:11px;border-radius:999px;border:1.5px solid var(--grn2);background:#fff;color:#1a1a2e;font-size:14px;cursor:pointer;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif;font-weight:500}
.secondary-btn:hover{background:var(--grn)}
.result-rows{background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r20);padding:0.75rem 1rem;margin-bottom:1rem}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--grn);font-size:13px}
.rrow:last-child{border-bottom:none}
.rformula{font-family:'JetBrains Mono',monospace;flex:1;color:#1a1a2e;font-size:12px}
.rbadge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rb-ok{background:var(--sage);color:var(--sagetext)}
.rb-half{background:var(--peach);color:var(--peachtext)}
.rb-ng{background:var(--rose);color:var(--rosetext)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.stat-c{background:var(--grn);border-radius:var(--r16);padding:0.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-l{font-size:11px;color:var(--grntext2)}
.msg-box{font-size:13px;color:var(--grntext2);line-height:1.7;padding:10px 14px;background:var(--grn);border-radius:var(--r16);margin-bottom:1rem;border:1px solid var(--grn2)}
.sa-q{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:10px;line-height:1.5;margin-top:1rem}
.sa-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:0.5rem}
.sa-btn{text-align:left;padding:11px 14px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#fff;font-size:13px;color:#1a1a2e;cursor:pointer;line-height:1.5;transition:all 0.15s;font-family:'Zen Maru Gothic',sans-serif}
.sa-btn:hover{background:var(--grn)}
.sa-btn.sel{background:var(--grn);border-color:var(--grn3);color:var(--grntext);font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em;line-height:1.3;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px;text-align:center}
.frac>span:last-child{padding:0 3px;text-align:center}
</style>
</head>
<body>
<div class="container">
<a class="back-link" href="index.html">← まちがいLABO トップへ</a>
<div class="top-header">
  <div class="top-icon">=</div>
  <div>
    <div class="top-title">方程式</div>
    <div class="top-sub">力試し → 分析 → 練習 → 再テスト</div>
    <span class="top-badge">中1・応用編</span>
  </div>
</div>
<div class="phase-tabs">
  <button class="ptab active" id="tab0" onclick="switchPhase(0)">力試し<span>テスト</span></button>
  <button class="ptab" id="tab1" onclick="switchPhase(1)">自己<span>分析</span></button>
  <button class="ptab" id="tab2" onclick="switchPhase(2)">STEP<span>練習</span></button>
  <button class="ptab" id="tab3" onclick="switchPhase(3)">再<span>テスト</span></button>
</div>
<div id="phase0"></div>
<div id="phase1" style="display:none"></div>
<div id="phase2" style="display:none"></div>
<div id="phase3" style="display:none"></div>
</div>
<script>
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}
function fr(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';}

// ===== 問題プール =====
// P1: 文字式の表し方
// P1: かっこを含む方程式（基本）
const POOL_P1=[
  {q:'2(x + 3) = 10　を解け',     a:'x = 2',     hint:'①両辺を2でわる: x+3=5　②移項: x=2 （または分配: 2x+6=10）'},
  {q:'3(x − 1) = 9　を解け',      a:'x = 4',     hint:'①両辺を3でわる: x−1=3　②移項: x=4'},
  {q:'2(x + 5) = 14　を解け',     a:'x = 2',     hint:'①両辺を2でわる: x+5=7　②移項: x=2'},
  {q:'4(x − 2) = 12　を解け',     a:'x = 5',     hint:'①両辺を4でわる: x−2=3　②移項: x=5'},
  {q:'5(x + 1) = 20　を解け',     a:'x = 3',     hint:'①両辺を5でわる: x+1=4　②移項: x=3'},
  {q:'3(x + 2) = 21　を解け',     a:'x = 5',     hint:'①両辺を3でわる: x+2=7　②移項: x=5'},
  {q:'2(x − 4) = 6　を解け',      a:'x = 7',     hint:'①両辺を2でわる: x−4=3　②移項: x=7'},
  {q:'6(x + 1) = 18　を解け',     a:'x = 2',     hint:'①両辺を6でわる: x+1=3　②移項: x=2'},
  {q:'−2(x − 3) = 4　を解け',     a:'x = 1',     hint:'①両辺を−2でわる: x−3=−2　②移項: x=1'},
  {q:'3(2x + 1) = 15　を解け',    a:'x = 2',     hint:'①両辺を3でわる: 2x+1=5　②2x=4 → x=2'},
  {q:'2(3x − 2) = 8　を解け',     a:'x = 2',     hint:'①両辺を2でわる: 3x−2=4　②3x=6 → x=2'},
  {q:'4(2x + 3) = 28　を解け',    a:'x = 2',     hint:'①両辺を4でわる: 2x+3=7　②2x=4 → x=2'},
  {q:'5(x − 1) = 3x + 5　を解け', a:'x = 5',     hint:'①分配: 5x−5=3x+5　②移項: 2x=10 → x=5'},
  {q:'3(x + 2) = 4x − 1　を解け', a:'x = 7',     hint:'①分配: 3x+6=4x−1　②移項: −x=−7 → x=7'},
  {q:'2(x + 4) = 3(x − 1)　を解け',a:'x = 11',   hint:'①分配: 2x+8=3x−3　②移項: −x=−11 → x=11'},
];

// P2: かっこ＋移項（やや複雑）
const POOL_P2=[
  {q:'3(x − 2) + 4 = x + 2　を解け',  a:'x = 2',     hint:'①分配: 3x−6+4=x+2　②整理: 3x−2=x+2　③移項: 2x=4 → x=2'},
  {q:'2(x + 1) − 3 = x + 4　を解け',  a:'x = 5',     hint:'①分配: 2x+2−3=x+4　②整理: 2x−1=x+4　③移項: x=5'},
  {q:'4(x − 1) = 2(x + 3)　を解け',   a:'x = 5',     hint:'①分配: 4x−4=2x+6　②移項: 2x=10 → x=5'},
  {q:'5x − 2(x − 1) = 11　を解け',    a:'x = 3',     hint:'①分配: 5x−2x+2=11　②整理: 3x+2=11　③移項: 3x=9 → x=3'},
  {q:'3(2x + 1) − 5 = x + 8　を解け', a:'x = 2',     hint:'①分配: 6x+3−5=x+8　②整理: 6x−2=x+8　③移項: 5x=10 → x=2'},
  {q:'2(x + 3) − (x − 1) = 9　を解け', a:'x = 2',    hint:'①分配: 2x+6−x+1=9　②整理: x+7=9　③移項: x=2'},
  {q:'4 − 2(x − 1) = 3x − 4　を解け', a:'x = 2',     hint:'①分配: 4−2x+2=3x−4　②整理: 6−2x=3x−4　③移項: −5x=−10 → x=2'},
  {q:'3(x − 2) − 4(x + 1) = −12　を解け', a:'x = 2',hint:'①分配: 3x−6−4x−4=−12　②整理: −x−10=−12　③移項: −x=−2 → x=2'},
  {q:'2(3x − 1) − 3(x + 1) = 4　を解け', a:'x = 3', hint:'①分配: 6x−2−3x−3=4　②整理: 3x−5=4　③移項: 3x=9 → x=3'},
  {q:'5(x + 2) − 3(x + 4) = 6　を解け', a:'x = 4',  hint:'①分配: 5x+10−3x−12=6　②整理: 2x−2=6　③移項: 2x=8 → x=4'},
  {q:'4(2x − 3) − 3(x + 1) = 0　を解け', a:'x = 3', hint:'①分配: 8x−12−3x−3=0　②整理: 5x−15=0　③移項: 5x=15 → x=3'},
  {q:'2(x + 5) − (3x − 2) = 4　を解け', a:'x = 8',  hint:'①分配: 2x+10−3x+2=4　②整理: −x+12=4　③移項: −x=−8 → x=8'},
];

// P3: 分数を含む方程式（両辺×LCMで分母をはらう）
const POOL_P3=[
  {q:'<span class="frac"><span>x</span><span>2</span></span> + 1 = 4　を解け',
   a:'x = 6',
   hint:'①両辺に2をかける: x+2=8　②移項: x=6'},
  {q:'<span class="frac"><span>x</span><span>3</span></span> − 2 = 1　を解け',
   a:'x = 9',
   hint:'①両辺に3をかける: x−6=3　②移項: x=9'},
  {q:'<span class="frac"><span>x</span><span>4</span></span> + 3 = 5　を解け',
   a:'x = 8',
   hint:'①両辺に4をかける: x+12=20　②移項: x=8'},
  {q:'<span class="frac"><span>x+2</span><span>3</span></span> = 4　を解け',
   a:'x = 10',
   hint:'①両辺に3をかける: x+2=12　②移項: x=10'},
  {q:'<span class="frac"><span>x−1</span><span>2</span></span> = 3　を解け',
   a:'x = 7',
   hint:'①両辺に2をかける: x−1=6　②移項: x=7'},
  {q:'<span class="frac"><span>2x+1</span><span>3</span></span> = 5　を解け',
   a:'x = 7',
   hint:'①両辺に3をかける: 2x+1=15　②移項: 2x=14 → x=7'},
  {q:'<span class="frac"><span>x</span><span>2</span></span> + <span class="frac"><span>x</span><span>3</span></span> = 5　を解け',
   a:'x = 6',
   hint:'①両辺に6（LCM）をかける: 3x+2x=30　②整理: 5x=30 → x=6'},
  {q:'<span class="frac"><span>x</span><span>4</span></span> − <span class="frac"><span>x</span><span>6</span></span> = 1　を解け',
   a:'x = 12',
   hint:'①両辺に12（LCM）をかける: 3x−2x=12　②整理: x=12'},
  {q:'<span class="frac"><span>x+3</span><span>2</span></span> = <span class="frac"><span>x</span><span>3</span></span> + 2　を解け',
   a:'x = 3',
   hint:'①両辺に6をかける: 3(x+3)=2x+12　②分配: 3x+9=2x+12　③移項: x=3'},
  {q:'<span class="frac"><span>2x−1</span><span>3</span></span> = <span class="frac"><span>x+1</span><span>2</span></span>　を解け',
   a:'x = 5',
   hint:'①両辺に6をかける: 2(2x−1)=3(x+1)　②分配: 4x−2=3x+3　③移項: x=5'},
  {q:'<span class="frac"><span>x</span><span>5</span></span> = <span class="frac"><span>x−6</span><span>2</span></span>　を解け',
   a:'x = 10',
   hint:'①両辺に10をかける: 2x=5(x−6)　②分配: 2x=5x−30　③移項: −3x=−30 → x=10'},
  {q:'<span class="frac"><span>x+1</span><span>4</span></span> − <span class="frac"><span>x−2</span><span>3</span></span> = 0　を解け',
   a:'x = 11',
   hint:'①両辺に12をかける: 3(x+1)−4(x−2)=0　②分配: 3x+3−4x+8=0　③整理: −x+11=0 → x=11'},
];

// P4: 小数を含む方程式（両辺×10、100で整数化）
const POOL_P4=[
  {q:'0.3x + 1 = 2.2　を解け',           a:'x = 4',     hint:'①両辺を10倍: 3x+10=22　②移項: 3x=12 → x=4'},
  {q:'0.5x − 1.5 = 1　を解け',           a:'x = 5',     hint:'①両辺を10倍: 5x−15=10　②移項: 5x=25 → x=5'},
  {q:'0.4x + 0.6 = 3　を解け',           a:'x = 6',     hint:'①両辺を10倍: 4x+6=30　②移項: 4x=24 → x=6'},
  {q:'0.2x − 1 = 0.5x − 4　を解け',      a:'x = 10',    hint:'①両辺を10倍: 2x−10=5x−40　②移項: −3x=−30 → x=10'},

function pipHtml(total,cur){
  return '<div class="pip-row">'+Array(total).fill(0).map((_,i)=>{

}

function revT(pfx){
  document.getElementById('ab'+pfx).className='ans-box show';

  document.getElementById('rb'+pfx).style.display='none';
  document.getElementById('dk'+pfx).style.display='none';
}
function dkT(pfx){
  const s=pfx==='0'?p0:p3;
  s.evals[s.cur]='ng';
  revT(pfx);
  document.getElementById('en'+pfx).className='e-btn e-ng sel';
  document.getElementById('nb'+pfx).disabled=false;
}
function evT(pfx,v){
  const s=pfx==='0'?p0:p3;
  s.evals[s.cur]=v;
  ['ok','half','ng'].forEach(k=>document.getElementById('e'+k[0]+pfx).className='e-btn e-'+k+(v===k?' sel':''));
  document.getElementById('nb'+pfx).disabled=false;

function nxT(pfx){
  const s=pfx==='0'?p0:p3;
  const qs=pfx==='0'?TEST1:TEST2;
  if(s.cur<qs.length-1){s.cur++;}else{s.done=true;}
  pfx==='0'?renderP0():renderP3();
}

function ruleRef(keys){
  const all={
    kakko:{name:'かっこ外し', expr:'2(x+3)=10 → 両辺÷2、または分配して 2x+6=10'},
    distrib:{name:'分配の注意', expr:'2(x−3) = 2x − 6（−3 にも 2 をかけ忘れない！）'},
    iko:{name:'移項', expr:'反対側へ渡すと符号が逆になる（＋⇄−）'},
    waru:{name:'両辺をわる', expr:'2x=8 → 両辺を2でわって x=4'},
    bunsu:{name:'分母をはらう', expr:'両辺に分母（複数あるときは LCM）をかける'},
    bunsi:{name:'分子に式があるとき', expr:fr('x+3','2')+'=5 → 両辺に2をかけて x+3=10'},
    syosu10:{name:'小数→整数化（10倍）', expr:'0.3x+1=2.2 → 両辺10倍: 3x+10=22'},
    syosu100:{name:'2桁の小数（100倍）', expr:'0.06x+0.1=0.2 → 両辺100倍: 6x+10=20'},
  };
  let h='<div class="formula-ref"><div class="formula-ref-title">📖 このSTEPに関係するルール</div>';
  keys.forEach(k=>{
    const r=all[k]; if(!r)return;
    h+='<div class="frow"><span class="fname">'+r.name+'</span><span class="fexpr">'+r.expr+'</span></div>';
  });
  h+='</div>';
  return h;
}

    html+='<div style="display:flex;gap:8px;margin-bottom:6px">';
    html+='<button onclick="toggleHint('+i+')" style="flex:1;text-align:left;padding:8px 12px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:var(--grn);font-size:12px;font-weight:700;color:var(--grntext);cursor:pointer;display:flex;justify-content:space-between">💡 ヒントを見る <span id="hintarr'+i+'">▼</span></button>';
    html+='<button onclick="toggleDev('+i+')" style="flex:1;text-align:left;padding:8px 12px;border-radius:var(--r16);border:1.5px solid var(--grn2);background:#edf9f0;font-size:12px;font-weight:700;color:var(--grntext2);cursor:pointer;display:flex;justify-content:space-between">答えと解説 <span id="devarr'+i+'">▼</span></button>';
    html+='</div>';
    html+='<div id="hintbody'+i+'" style="display:none;background:var(--grn);border:1px solid var(--grn2);border-radius:var(--r16);padding:0.75rem 1rem;margin-bottom:6px;font-size:13px;color:var(--grntext);line-height:1.8">'+q.h+'</div>';
    html+='<div id="devans'+i+'" style="display:none;background:#edf9f0;border:1px solid var(--grn2);border-radius:var(--r16);padding:1rem;font-size:12px;color:var(--grntext2);line-height:1.9">'+q.a+'</div>';
    html+='</div>';
  });
  return html;
}
function devCheck(i){if(!window._devChecks)window._devChecks=Array(6).fill(false);window._devChecks[i]=document.getElementById('dev'+i).checked;}
function toggleDev(i){var b=document.getElementById('devans'+i),a=document.getElementById('devarr'+i);if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'\u25B2':'\u25BC';}
function toggleHint(i){var b=document.getElementById('hintbody'+i),a=document.getElementById('hintarr'+i);if(!b)return;var open=b.style.display==='block';b.style.display=open?'none':'block';if(a)a.textContent=open?'\u25B2':'\u25BC';}
function c4(){return '<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:1rem">🔁 基礎に戻って確認</div><div style="font-size:13px;color:var(--grntext2);line-height:1.8;margin-bottom:1rem">☆ 満点でも「なんとなく解けた」部分がないか確認しよう！</div><button class="primary-btn" onclick="switchPhase(2)">STEP練習へ戻る →</button>';}
var _restTimer=null,_restRemain=0,_restPaused=false;
function c5(){
  var h='';
  h+='<div style="font-size:16px;font-weight:700;color:var(--grntext);margin-bottom:1rem">☕ 休憩する</div>';
  h+='<div style="font-size:14px;font-weight:700;color:#1a1a2e;line-height:1.8;margin-bottom:0.5rem">今日の目標は達成！ゆっくり休もう。<br>頑張った脳には休憩が必要！<br>記憶は休んでいる間に整理されるよ。</div>';
  h+='<div style="font-size:12px;color:#aaa;line-height:1.9;margin-bottom:1.25rem">深呼吸する / 空を見る / 水を飲む / 少し伸びやマッサージをする... などどれも大事な時間✨</div>';
  h+='<div style="background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r16);padding:1rem">';
  h+='<div style="font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:10px">何分休憩する？（最大15分）</div>';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
  h+='<input type="number" id="rest-min" min="1" max="15" value="5" style="width:72px;font-size:24px;font-weight:700;text-align:center;border:1.5px solid var(--grn2);border-radius:var(--r16);padding:8px;font-family:JetBrains Mono,monospace;color:var(--grntext)" oninput="if(this.value>15)this.value=15;if(this.value<1)this.value=1">';
  h+='<span style="font-size:16px;color:#1a1a2e;font-weight:700">分</span>';
  h+='<button onclick="startRest()" id="rest-start-btn" style="padding:10px 20px;border-radius:999px;border:none;background:var(--grn3);color:#fff;font-size:14px;font-weight:700;cursor:pointer">スタート ▶</button>';
  h+='</div>';
  h+='<div id="rest-timer" style="display:none;text-align:center">';
  h+='<div id="rest-display" style="font-size:52px;font-weight:700;font-family:JetBrains Mono,monospace;color:var(--grntext);margin-bottom:8px">05:00</div>';
  h+='<div style="display:flex;gap:8px;justify-content:center">';
  h+='<button onclick="pauseRest()" id="rest-pause-btn" style="padding:8px 18px;border-radius:999px;border:1.5px solid var(--grn2);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--grntext)">⏸ 一時停止</button>';
  h+='<button onclick="stopRest()" style="padding:8px 18px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#888">✕ やめる</button>';
  h+='</div></div>';
  h+='<div id="rest-done" style="display:none;text-align:center;padding:1rem">';
  h+='<div style="font-size:32px;margin-bottom:8px">🌿</div>';
  h+='<div style="font-size:28px;font-weight:700;color:var(--grntext);margin-bottom:8px">終了！</div>';
  h+='<div style="font-size:14px;color:var(--grntext2);line-height:1.8">気持ちを切り替えて<br>次の課題に挑戦しよう！</div>';
  h+='</div></div>';
  return h;
}
function startRest(){
  var min=Math.min(15,Math.max(1,parseInt(document.getElementById('rest-min').value)||5));
  _restRemain=min*60; _restPaused=false;
  document.getElementById('rest-start-btn').style.display='none';
  document.getElementById('rest-min').disabled=true;
  document.getElementById('rest-timer').style.display='block';
  updateRestDisplay();
  if(_restTimer)clearInterval(_restTimer);
  _restTimer=setInterval(function(){
    if(_restPaused)return;
    _restRemain--;
    updateRestDisplay();
    if(_restRemain<=0){
      clearInterval(_restTimer);
      document.getElementById('rest-timer').style.display='none';
      document.getElementById('rest-done').style.display='block';
    }
  },1000);
}
function updateRestDisplay(){
  var el=document.getElementById('rest-display');
  if(!el)return;
  var m=Math.floor(_restRemain/60),s=_restRemain%60;
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function pauseRest(){
  _restPaused=!_restPaused;
  var btn=document.getElementById('rest-pause-btn');
  if(btn)btn.textContent=_restPaused?'▶ 再開':'⏸ 一時停止';
}
function stopRest(){
  if(_restTimer)clearInterval(_restTimer);
  document.getElementById('rest-timer').style.display='none';
  document.getElementById('rest-start-btn').style.display='inline-flex';
  document.getElementById('rest-min').disabled=false;
}

renderP0();
</script>
</body>
</html>
